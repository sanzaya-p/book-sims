<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px;}canvas{background:#222;border:1px solid #444;border-radius:4px;margin:20px;}#controls{display:grid;grid-template-columns:150px 200px 50px;gap:10px;background:#333;padding:15px;border-radius:8px;}.slider-label{font-size:12px;color:#aaa;}.metric{font-weight:bold;color:#0af;}</style></head><body><h3>Ch24: Geometric Non-Linearity & Snap-Through</h3><canvas id="simCanvas" width="600" height="300"></canvas><div id="controls"><span class="slider-label">Arch Height (H):</span><input type="range" id="hSlider" min="1" max="50" value="25"><span id="hVal">25</span><span class="slider-label">Stiffness (EA):</span><input type="range" id="kSlider" min="100" max="1000" value="500"><span id="kVal">500</span><span class="slider-label">Displacement:</span><input type="range" id="uSlider" min="0" max="60" value="0"><span id="uVal">0</span></div><div style="margin-top:20px;">Force: <span id="fMetric" class="metric">0.00</span> N | Status: <span id="sMetric" class="metric">Stable</span></div><script>const canvas=document.getElementById('simCanvas');const ctx=canvas.getContext('2d');const hS=document.getElementById('hSlider');const kS=document.getElementById('kSlider');const uS=document.getElementById('uSlider');function draw(){const H=parseFloat(hS.value);const EA=parseFloat(kS.value);const u=parseFloat(uS.value);const L=150;const cx=300;const cy=200;uS.max=2*H+5;document.getElementById('hVal').innerText=H;document.getElementById('kVal').innerText=EA;document.getElementById('uVal').innerText=u;const L0=Math.sqrt(L*L+H*H);const Lp=Math.sqrt(L*L+(H-u)*(H-u));const strain=(Lp-L0)/L0;const force=EA*strain*((H-u)/Lp);document.getElementById('fMetric').innerText=force.toFixed(2);const stiffness=EA*( (L*L)/Math.pow(L*L+(H-u)*(H-u), 1.5) );document.getElementById('sMetric').innerText=force<0 && u < H ? 'Snapping...' : (u > H ? 'State 1' : 'State 0');ctx.clearRect(0,0,600,300);ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(cx-L,cy);ctx.lineTo(cx+L,cy);ctx.stroke();ctx.strokeStyle='#0af';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx-L,cy);ctx.quadraticCurveTo(cx,cy-2*(H-u),cx+L,cy);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy-(H-u),6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#555';ctx.beginPath();for(let i=0;i<600;i++){const ux=i/10;const Lpx=Math.sqrt(L*L+(H-ux)*(H-ux));const fx=EA*((Lpx-L0)/L0)*((H-ux)/Lpx);ctx.lineTo(i,100-fx*0.5);}ctx.stroke();ctx.fillStyle='#f00';ctx.fillRect(u*10, 100-force*0.5, 4, 4);}hS.oninput=kS.oninput=uS.oninput=draw;draw();</script></body></html>
