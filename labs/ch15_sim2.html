<!DOCTYPE html><html><head><style>body{background:#0a0a0a;color:#0f0;font-family:monospace;text-align:center;margin:0;padding:20px}canvas{border:1px solid #0f0;background:#000}#controls{display:flex;justify-content:center;gap:20px;margin:20px;background:#111;padding:15px;border-radius:8px}.p-box{display:flex;flex-direction:column;align-items:center}input{width:150px}</style></head><body><h1>Acoustic State Erasure (Langevin)</h1><canvas id="plot" width="700" height="350"></canvas><div id="controls"><div class="p-box"><span>Acoustic Noise (σ)</span><input type="range" id="noise" min="0" max="5" step="0.1" value="0.5"><span id="nv">0.5</span></div><div class="p-box"><span>Mass (m)</span><input type="range" id="mass" min="0.5" max="5" step="0.1" value="1.0"><span id="mv">1.0</span></div><div class="p-box"><span>Damping (γ)</span><input type="range" id="damp" min="0.1" max="2" step="0.1" value="0.8"><span id="dv">0.8</span></div></div><div id="stats">Bit-Rot Frequency: 0.00 Hz</div><script>const canvas=document.getElementById('plot'),ctx=canvas.getContext('2d'),nIn=document.getElementById('noise'),mIn=document.getElementById('mass'),dIn=document.getElementById('damp');let x=-1.414,v=0,flips=0,lastWell=-1,hist=[];const dt=0.05,a=1,b=4;function step(){const sigma=parseFloat(nIn.value),m=parseFloat(mIn.value),gamma=parseFloat(dIn.value);document.getElementById('nv').innerText=sigma;document.getElementById('mv').innerText=m;document.getElementById('dv').innerText=gamma;const fDet=-(4*a*Math.pow(x,3)-2*b*x);const noise=sigma*(Math.random()-0.5)*Math.sqrt(dt)*10;v+=(fDet-gamma*v)*dt/m+noise/m;x+=v*dt;if(x>0&&lastWell===-1){flips++;lastWell=1}else if(x<0&&lastWell===1){flips++;lastWell=-1}hist.push(x);if(hist.length>700)hist.shift();document.getElementById('stats').innerText=`Flipping Events: ${flips} | State: ${x>0?'[ 1 ]':'[ 0 ]'}`}function draw(){ctx.fillStyle='black';ctx.fillRect(0,0,700,350);ctx.strokeStyle='#050';ctx.beginPath();ctx.moveTo(0,175);ctx.lineTo(700,175);ctx.stroke();ctx.strokeStyle='#0f0';ctx.beginPath();for(let i=0;i<hist.length;i++){ctx.lineTo(i,175-hist[i]*40)}ctx.stroke();ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(hist.length,175-x*40,5,0,6.28);ctx.fill()}function loop(){step();draw();requestAnimationFrame(loop)}loop();</script></body></html>
