<!DOCTYPE html><html><head><title>Mechanical Soliton Logic</title><style>body{background:#000;color:#0f0;font-family:'Courier New',monospace;text-align:center}canvas{background:#111;border:2px solid #0f0;margin:10px}#controls{background:#222;padding:15px;display:inline-block;border-radius:10px}.row{margin:10px}input{width:200px}</style></head><body><h1>Solitonic Pulse Propagation</h1><div id="controls"><div class="row">Coupling (k): <input type="range" id="kRange" min="0.1" max="10" step="0.1" value="2.5"> <span id="kv">2.5</span></div><div class="row">Damping: <input type="range" id="dRange" min="0.01" max="0.5" step="0.01" value="0.1"> <span id="dv">0.1</span></div><button onclick="resetChain()">Trigger Signal (Left Bit Flip)</button></div><br><canvas id="chainCanvas" width="800" height="300"></canvas><script>const canvas=document.getElementById('chainCanvas'),ctx=canvas.getContext('2d');let nodes=40,x=new Array(nodes).fill(-1),v=new Array(nodes).fill(0),dt=0.1,k=2.5,damping=0.1;function resetChain(){x.fill(-1);v.fill(0);x[0]=1.5}function update(){for(let i=1;i<nodes-1;i++){let f_int=-Math.pow(x[i],3)+x[i];let f_ext=k*(x[i+1]-2*x[i]+x[i-1]);let a=(f_int+f_ext-damping*v[i]);v[i]+=a*dt;x[i]+=v[i]*dt}x[0]=1.5;v[0]=0}function draw(){ctx.clearRect(0,0,800,300);for(let i=0;i<nodes;i++){let px=(i+0.5)*(800/nodes);let py=150-x[i]*50;ctx.fillStyle=x[i]>0?'#f00':'#00f';ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();if(i>0){ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo((i-0.5)*(800/nodes),150-x[i-1]*50);ctx.lineTo(px,py);ctx.stroke()}}update();requestAnimationFrame(draw)}document.getElementById('kRange').oninput=e=>{k=parseFloat(e.target.value);document.getElementById('kv').innerText=k};document.getElementById('dRange').oninput=e=>{damping=parseFloat(e.target.value);document.getElementById('dv').innerText=damping};resetChain();draw();</script></body></html>
