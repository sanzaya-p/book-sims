<!DOCTYPE html><html><head><style>body{background:#0a0a0a;color:#ddd;font-family:monospace;display:flex;flex-direction:column;align-items:center}canvas{background:#000;border:2px solid #333;cursor:crosshair}.ui{width:700px;background:#1a1a1a;padding:20px;margin:10px;border-radius:5px;display:flex;justify-content:space-between;align-items:center}button{padding:10px 20px;background:#06a;color:white;border:none;border-radius:4px;cursor:pointer}button:hover{background:#08d}.status{font-size:1.2em;color:#0f0}input[type=range]{width:150px}</style></head><body><h1>Arc-Length Solver: The Riks Step</h1><div class="ui"><div>Mode: <span id="modeText" class="status">Modified Riks</span><br><label>Step Size (Δs): </label><input type="range" id="stepRange" min="1" max="20" value="10"></div><button id="stepBtn">Next Iteration</button><button id="resetBtn" style="background:#555">Reset</button></div><canvas id="simCanvas" width="700" height="500"></canvas><script>const canvas=document.getElementById('simCanvas');const ctx=canvas.getContext('2d');let u=0,l=0;let history=[];const h=4.0;function getForce(u_val){return (h*h)*(u_val-1.5*u_val*u_val+0.5*u_val*u_val*u_val)+u_val;}function drawCurve(){ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=2.2;x+=0.02){const y=getForce(x);const px=100+x*250;const py=400-y*15;if(x===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.stroke();}function render(){ctx.clearRect(0,0,700,500);drawCurve();ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(100,400);ctx.lineTo(650,400);ctx.moveTo(100,50);ctx.lineTo(100,450);ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle='#0af';ctx.beginPath();history.forEach((p,i)=>{const px=100+p.u*250;const py=400-p.l*15;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);});ctx.stroke();if(history.length>0){const last=history[history.length-1];const px=100+last.u*250;const py=400+ -last.l*15;const ds=document.getElementById('stepRange').value;ctx.strokeStyle='rgba(255,255,0,0.3)';ctx.beginPath();ctx.arc(px,py,ds*2,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();}}document.getElementById('stepBtn').onclick=()=>{const ds=document.getElementById('stepRange').value/100;const K=(h*h)*(1-3*u+1.5*u*u)+1;const dl=ds/Math.sqrt(K*K+1);const du=K*dl;u+=du;l=getForce(u);history.push({u,l});render();};document.getElementById('resetBtn').onclick=()=>{u=0;l=0;history=[];render();};render();</script></body></html>
