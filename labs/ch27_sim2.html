<!DOCTYPE html>
<html>
<head>
    <title>High-Density Fluidics: Latency and Re Divergence</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 24px; width: 800px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #38bdf8; font-size: 1.5rem; }
        canvas { background: #020617; border-radius: 8px; border: 1px solid #475569; width: 100%; height: 200px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .control-group { background: #0f172a; padding: 15px; border-radius: 8px; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; font-weight: bold; }
        .val { color: #38bdf8; }
        input[type=range] { width: 100%; cursor: pointer; }
        .stats { display: flex; justify-content: space-between; margin-top: 20px; padding: 15px; background: #334155; border-radius: 8px; font-family: monospace; }
        .stat-item { text-align: center; }
        .stat-label { font-size: 0.75rem; color: #94a3b8; display: block; }
        .equation { margin-top: 15px; font-size: 0.9rem; font-style: italic; color: #94a3b8; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Deep Sea Fluidic Logic Latency</h2>
        <canvas id="simCanvas"></canvas>
        
        <div class="controls">
            <div class="control-group">
                <div class="label-row"><span>Operating Depth (m)</span><span id="depthVal" class="val">0</span></div>
                <input type="range" id="depthRange" min="0" max="11000" value="0" step="100">
            </div>
            <div class="control-group">
                <div class="label-row"><span>Viscosity Coeff (α)</span><span id="alphaVal" class="val">2.5e-8</span></div>
                <input type="range" id="alphaRange" min="0.5e-8" max="5e-8" value="2.5e-8" step="0.1e-8">
            </div>
        </div>

        <div class="stats">
            <div class="stat-item"><span class="stat-label">PRESSURE</span><span id="statP" class="val">0.0</span> MPa</div>
            <div class="stat-item"><span class="stat-label">VISCOSITY</span><span id="statMu" class="val">1.00</span> cP</div>
            <div class="stat-item"><span class="stat-label">REYNOLDS (Re)</span><span id="statRe" class="val">525.0</span></div>
            <div class="stat-item"><span class="stat-label">LATENCY SCALE</span><span id="statLat" class="val">1.00</span>x</div>
        </div>
        
        <div class="equation">
            Governing: μ(P) = μ₀ ⋅ exp(α ⋅ P) | Signal Velocity v ∝ 1/μ
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const depthRange = document.getElementById('depthRange');
        const alphaRange = document.getElementById('alphaRange');

        // Physics constants
        const mu0 = 0.001; // Pa*s
        const rho = 1050;  // kg/m3
        const g = 9.81;    // m/s2
        const D = 0.005;   // m
        const v0 = 0.1;    // Surface velocity m/s

        let particles = [];
        const numParticles = 20;

        function initParticles() {
            particles = [];
            for (let i = 0; i < numParticles; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height / 2 + (Math.random() - 0.5) * 30,
                    r: 4 + Math.random() * 2
                });
            }
        }

        function update() {
            // Resize for retina
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
                initParticles();
            }

            const depth = parseFloat(depthRange.value);
            const alpha = parseFloat(alphaRange.value);
            
            // Physics
            const pressure = rho * g * depth; // Pa
            const muP = mu0 * Math.exp(alpha * pressure);
            const latency = muP / mu0;
            const velocity = v0 / latency;
            const re = (rho * v0 * D) / muP;

            // Update UI
            document.getElementById('depthVal').innerText = depth.toLocaleString();
            document.getElementById('alphaVal').innerText = alpha.toExponential(2);
            document.getElementById('statP').innerText = (pressure / 1e6).toFixed(1);
            document.getElementById('statMu').innerText = (muP * 1000).toFixed(2);
            document.getElementById('statLat').innerText = latency.toFixed(2);
            document.getElementById('statRe').innerText = re.toFixed(1);

            // Clear canvas
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Logic Channel
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.strokeRect(50, canvas.height / 2 - 25, canvas.width - 100, 50);

            // Particle speed factors
            const pixelsPerMeter = 2000; // Visual scale
            const dt = 1/60;
            const dx = velocity * pixelsPerMeter * dt;

            // Draw signal pulse
            particles.forEach(p => {
                p.x += dx * 5; // scaled for visibility
                if (p.x > canvas.width - 50) p.x = 50;

                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2);
                gradient.addColorStop(0, '#38bdf8');
                gradient.addColorStop(1, 'transparent');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r * 2, 0, Math.PI * 2);
                ctx.fill();
            });

            // Visualizing Reynolds Divergence (Laminar vs Turbulent)
            // Higher depth = Higher viscosity = Lower Reynolds = More stable/laminar but slower
            ctx.fillStyle = re > 1000 ? '#f59e0b' : '#10b981';
            ctx.font = '12px Arial';
            ctx.fillText(re > 1000 ? "Flow: Transitional/Unstable" : "Flow: Stable Laminar", 60, canvas.height / 2 - 35);

            requestAnimationFrame(update);
        }

        initParticles();
        update();
    </script>
</body>
</html>
