<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;margin:20px}canvas{background:#222;border:1px solid #444;display:block;margin:10px auto}.controls{background:#333;padding:15px;border-radius:8px;max-width:800px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:20px}.stat{font-weight:bold;color:#0f0}label{display:block;margin-bottom:5px}</style></head><body><h2 style='text-align:center'>Viscoelastic Logic: SLS Model Simulation</h2><div class='controls'><div><label>Viscosity (&eta;): <span id='etaVal'>0.5</span></label><input type='range' id='eta' min='0.05' max='5' step='0.05' value='0.5' style='width:100%'><label>Spring Ratio (k2): <span id='k2Val'>2.0</span></label><input type='range' id='k2' min='0.1' max='10' step='0.1' value='2.0' style='width:100%'></div><div><label>Trigger Force: <span id='fVal'>0.8</span></label><input type='range' id='f' min='0.1' max='2' step='0.1' value='0.8' style='width:100%'><button id='triggerBtn' style='width:100%;padding:10px;margin-top:10px;cursor:pointer'>Trigger Bit-Flip</button></div></div><canvas id='simCanvas' width='800' height='400'></canvas><div style='text-align:center;margin-top:10px'>Position (x) over time. Red dashed lines are stable states (0 and 1). <span id='status'>Waiting...</span></div><script>const canvas=document.getElementById('simCanvas'),ctx=canvas.getContext('2d');let x=-1,v=0,z=0,t=0,history=[],triggering=false;const m=0.1,k1=1;function dVdx(pos){return pos*pos*pos-pos}function update(){let eta=parseFloat(document.getElementById('eta').value),k2=parseFloat(document.getElementById('k2').value),forceVal=parseFloat(document.getElementById('f').value);document.getElementById('etaVal').innerText=eta;document.getElementById('k2Val').innerText=k2;document.getElementById('fVal').innerText=forceVal;let dt=0.016;let f_ext=triggering?forceVal:0;let dvdt=(f_ext-dVdx(x)-k1*x-z)/m;let dzdt=k2*v-(k2/eta)*z;v+=dvdt*dt;x+=v*dt;z+=dzdt*dt;t+=dt;history.push({t:t,x:x});if(history.length>400)history.shift();draw();requestAnimationFrame(update)}function draw(){ctx.clearRect(0,0,800,400);ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(0,100);ctx.lineTo(800,100);ctx.moveTo(0,300);ctx.lineTo(800,300);ctx.stroke();ctx.strokeStyle='#ff5555';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(0,100);ctx.lineTo(800,100);ctx.moveTo(0,300);ctx.lineTo(800,300);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#00aaff';ctx.lineWidth=2;ctx.beginPath();history.forEach((pt,i)=>{let px=i*(800/400),py=200-pt.x*100;if(i==0)ctx.moveTo(px,py);else ctx.lineTo(px,py)});ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(history.length*(800/400)-2,200-x*100,5,0,Math.PI*2);ctx.fill();document.getElementById('status').innerText=x>0.5?'State: 1':'State: 0'}document.getElementById('triggerBtn').onmousedown=()=>triggering=true;document.getElementById('triggerBtn').onmouseup=()=>triggering=false;update();</script></body></html>
