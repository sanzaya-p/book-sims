<!DOCTYPE html><html><head><style>body{background:#121212;color:#e0e0e0;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px;}canvas{background:#1e1e1e;border:1px solid #444;border-radius:4px;cursor:crosshair;}.controls{margin-top:20px;display:grid;grid-template-columns:150px 300px 80px;gap:15px;align-items:center;background:#252525;padding:20px;border-radius:8px;}.val{font-weight:bold;color:#00e5ff;}h2{margin:0 0 10px 0;color:#fff;}.legend{margin-top:10px;font-size:0.85em;color:#888;}</style></head><body><h2>The Double-Well Potential Landscape</h2><canvas id="simCanvas" width="700" height="400"></canvas><div class="controls"><label>Q-Factor (h/t):</label><input type="range" id="qSlider" min="0.5" max="8.0" step="0.05" value="3.0"><span class="val" id="qVal">3.00</span><label>Bending Rigidity:</label><input type="range" id="eiSlider" min="0.1" max="2.0" step="0.1" value="1.0"><span class="val" id="eiVal">1.00</span><button onclick="resetSim()" style="grid-column: span 3; padding: 8px; background: #444; color: white; border: none; border-radius: 4px; cursor: pointer;">Reset to Default (Q=2.31)</button></div><div id="status" style="margin-top:15px; font-style: italic;">Regime: Bistable</div><script>const canvas=document.getElementById('simCanvas');const ctx=canvas.getContext('2d');const qSlider=document.getElementById('qSlider');const eiSlider=document.getElementById('eiSlider');function energy(a, Q, EI){const bending = 0.5 * EI * (a**2);const stretching = 0.5 * (Q**2) * (Math.pow((1 - a/Q), 2) - 1)**2;return bending + stretching;}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const Q = parseFloat(qSlider.value);const EI = parseFloat(eiSlider.value);document.getElementById('qVal').innerText = Q.toFixed(2);document.getElementById('eiVal').innerText = EI.toFixed(2);const status = document.getElementById('status');if(Q < 2.31) status.innerText = "Regime: Monostable (Analog Elasticity)";else if(Q < 5.6) status.innerText = "Regime: Bistable (Digital Memory)";else status.innerText = "Regime: Unstable/Higher Modes (Logic Hallucination)";ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(0,350);ctx.lineTo(700,350);ctx.stroke();ctx.moveTo(350,0);ctx.lineTo(350,400);ctx.stroke();ctx.beginPath();ctx.strokeStyle='#00e5ff';ctx.lineWidth=3;const scaleX = 50;const scaleY = 15;for(let x=-4; x<10; x+=0.05){const e = energy(x, Q, EI);const px = 350 + x*scaleX;const py = 350 - e*scaleY;if(x===-4) ctx.moveTo(px, py);else ctx.lineTo(px, py);}ctx.stroke();ctx.fillStyle='#ff4081';for(let x=-4; x<10; x+=0.01){const h = 0.001;const slope = (energy(x+h, Q, EI) - energy(x-h, Q, EI))/(2*h);const d2 = (energy(x+h, Q, EI) - 2*energy(x, Q, EI) + energy(x-h, Q, EI))/(h*h);if(Math.abs(slope) < 0.1 && d2 > 0){ctx.beginPath();ctx.arc(350 + x*scaleX, 350 - energy(x, Q, EI)*scaleY, 6, 0, 2*Math.PI);ctx.fill();}}requestAnimationFrame(draw);}function resetSim(){qSlider.value = 2.31;eiSlider.value = 1.0;}qSlider.addEventListener('input', draw);eiSlider.addEventListener('input', draw);draw();</script></body></html>
