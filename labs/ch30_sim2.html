<!DOCTYPE html><html><head><style>body{background:#fdfdfd;color:#333;font-family:serif;text-align:center;padding:10px}canvas{border:1px solid #ccc;cursor:crosshair}.ui{display:inline-block;text-align:left;background:#eee;padding:15px;border-radius:8px;margin:10px}.val{font-weight:bold;color:#d32f2f}</style></head><body><h2>Asymmetric Displacement Logic (ADL)</h2><div class='ui'><div>a (Stiffness): <input type='range' id='pA' min='0.5' max='2' step='0.1' value='1'> <span id='vA' class='val'></span></div><div>b (Bistability): <input type='range' id='pB' min='1' max='8' step='0.1' value='4'> <span id='vB' class='val'></span></div><div>c (Radiation Bias): <input type='range' id='pC' min='-5' max='5' step='0.1' value='0'> <span id='vC' class='val'></span></div><button onclick='resetPos()'>Reset Bit (0)</button></div><br><canvas id='plot' width='600' height='400'></canvas><div id='state' style='font-size:1.5em;margin-top:10px'>State: Logic 0</div><script>const cvs=document.getElementById('plot'),ctx=cvs.getContext('2d');let bx=-1.5,bv=0;const pA=document.getElementById('pA'),pB=document.getElementById('pB'),pC=document.getElementById('pC');function resetPos(){bx=-2;bv=0}function V(x,a,b,c){return a*Math.pow(x,4)-b*Math.pow(x,2)+c*x}function F(x,a,b,c){return -(4*a*Math.pow(x,3)-2*b*x+c)}function loop(){const a=parseFloat(pA.value),b=parseFloat(pB.value),c=parseFloat(pC.value);document.getElementById('vA').innerText=a;document.getElementById('vB').innerText=b;document.getElementById('vC').innerText=c;ctx.clearRect(0,0,600,400);ctx.beginPath();ctx.strokeStyle='#999';ctx.moveTo(0,200);ctx.lineTo(600,200);ctx.stroke();ctx.beginPath();ctx.strokeStyle='#2196F3';ctx.lineWidth=3;for(let i=0;i<600;i++){const x=(i-300)/60;const y=200+V(x,a,b,c)*10;if(i==0)ctx.moveTo(i,y);else ctx.lineTo(i,y)}ctx.stroke();const force=F(bx,a,b,c);bv+=force*0.05;bv*=0.95;bx+=bv*0.05;const circleX=300+bx*60;const circleY=200+V(bx,a,b,c)*10;ctx.fillStyle='#d32f2f';ctx.beginPath();ctx.arc(circleX,circleY,8,0,Math.PI*2);ctx.fill();document.getElementById('state').innerText=bx>0?'State: Logic 1 (Gripped)':'State: Logic 0 (Released)';requestAnimationFrame(loop)}loop();</script></body></html>
