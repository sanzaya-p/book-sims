<!DOCTYPE html>
<html>
<head>
    <title>Twin-Path Contrastive Learning</title>
    <style>
        body { font-family: monospace; background: #0b0e14; color: #4af626; text-align: center; }
        .container { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        canvas { border: 2px solid #4af626; margin: 20px; }
        .ui { background: #161b22; padding: 20px; border-radius: 10px; width: 600px; text-align: left; }
        .slider-group { margin-bottom: 15px; }
        .slider-group label { display: block; color: #8b949e; margin-bottom: 5px; }
        input[type=range] { width: 100%; }
        .stats { display: flex; justify-content: space-between; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>Contrastive Learning Material</h1>
    <div class="container">
        <canvas id="learnCanvas" width="600" height="150"></canvas>
        <div class="ui">
            <div class="slider-group">
                <label>Target Position (Blue Mark): <span id="targetVal">150</span></label>
                <input type="range" id="targetIn" min="50" max="550" value="400">
            </div>
            <div class="slider-group">
                <label>Learning Rate (&eta;): <span id="etaVal">0.1</span></label>
                <input type="range" id="etaIn" min="0.01" max="1.0" step="0.01" value="0.1">
            </div>
            <div class="stats">
                <div>Error (MSE): <span id="errVal">0.0</span></div>
                <div>Global Stiff: <span id="avgK">0.0</span></div>
            </div>
            <button onclick="resetK()" style="margin-top:10px; padding:10px; width:100%; cursor:pointer; background:#4af626; color:#000; border:none; font-weight:bold;">RESET STRUTS</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('learnCanvas');
        const ctx = canvas.getContext('2d');
        const numStruts = 10;
        let k = new Array(numStruts).fill(50);
        let pos = 0;

        function update() {
            const target = parseFloat(document.getElementById('targetIn').value);
            const eta = parseFloat(document.getElementById('etaIn').value);
            document.getElementById('targetVal').innerText = target;
            document.getElementById('etaVal').innerText = eta;

            // Physics: displacement u = Force / K_eff
            const force = 5000;
            const invK = k.reduce((acc, val) => acc + (1/val), 0);
            const u_free = force * invK;
            const u_nudge = target;

            // Calculate local strain for update
            // epsilon_i = (Force / K_eff) / k_i (Free)
            // epsilon_i_nudge = (Target_U / K_eff) / k_i (Nudge)
            const eps_free = k.map(ki => (u_free / invK) / ki);
            const eps_nudge = k.map(ki => (u_nudge / invK) / ki);

            // Update Law: Delta k = eta * (eps_n^2 - eps_f^2)
            for(let i=0; i<numStruts; i++) {
                let dk = eta * (Math.pow(eps_nudge[i]/10, 2) - Math.pow(eps_free[i]/10, 2));
                k[i] = Math.max(5, k[i] + dk);
            }

            pos = u_free;
            document.getElementById('errVal').innerText = Math.pow(target - u_free, 2).toFixed(2);
            document.getElementById('avgK').innerText = (k.reduce((a,b)=>a+b,0)/numStruts).toFixed(1);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Target
            const targetX = parseFloat(document.getElementById('targetIn').value);
            ctx.strokeStyle = '#00ffff';
            ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(targetX, 0); ctx.lineTo(targetX, canvas.height); ctx.stroke();
            ctx.setLineDash([]);

            // Draw Struts
            let currentX = 20;
            const segmentWidth = (pos) / numStruts;
            for(let i=0; i<numStruts; i++) {
                const intensity = Math.min(255, k[i] * 2);
                ctx.strokeStyle = `rgb(74, ${intensity}, 38)`;
                ctx.lineWidth = 4 + k[i]/20;
                ctx.beginPath();
                ctx.moveTo(currentX, 75);
                currentX += segmentWidth + 5;
                ctx.lineTo(currentX, 75);
                ctx.stroke();
            }

            // Head node
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(currentX, 75, 8, 0, 7); ctx.fill();
        }

        function resetK() {
            k = new Array(numStruts).fill(50);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
