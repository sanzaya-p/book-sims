<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;margin:0;padding:20px}canvas{background:#222;border:1px solid #444;border-radius:4px;cursor:crosshair}#ui{margin-top:20px;display:grid;grid-template-columns:150px 200px 80px;gap:15px;align-items:center}.slider-label{font-size:0.9em;color:#aaa}.metric{font-family:monospace;color:#0f0;margin-top:10px}</style></head><body><h2>Bistable Bit Dynamics</h2><canvas id="cvs" width="600" height="300"></canvas><div id="ui"><div class="slider-label">Barrier Depth (b)</div><input type="range" id="b_param" min="1" max="10" step="0.1" value="4"><span id="b_val">4.0</span><div class="slider-label">Damping (γ)</div><input type="range" id="gamma_param" min="0.1" max="2" step="0.05" value="0.5"><span id="g_val">0.5</span><div class="slider-label">Input Force</div><input type="range" id="f_param" min="-10" max="10" step="0.1" value="0"><span id="f_val">0.0</span></div><button id="reset" style="margin-top:20px;padding:10px 20px;cursor:pointer">Reset System</button><div class="metric" id="state_readout">State: Scanning...</div><script>const canvas=document.getElementById('cvs'),ctx=canvas.getContext('2d'),bSlider=document.getElementById('b_param'),gSlider=document.getElementById('gamma_param'),fSlider=document.getElementById('f_param'),bVal=document.getElementById('b_val'),gVal=document.getElementById('g_val'),fVal=document.getElementById('f_val'),readout=document.getElementById('state_readout');let x=-2,v=0,a=1,b=4,gamma=0.5,f_ext=0;function getV(px){return a*Math.pow(px,4)-b*Math.pow(px,2)}function getF(px){return-(4*a*Math.pow(px,3)-2*b*px)+f_ext}function update(){b=parseFloat(bSlider.value);gamma=parseFloat(gSlider.value);f_ext=parseFloat(fSlider.value);bVal.innerText=b.toFixed(1);gVal.innerText=gamma.toFixed(2);fVal.innerText=f_ext.toFixed(1);for(let i=0;i<10;i++){let force=getF(x);let acc=(force-gamma*v)/1.0;v+=acc*0.01;x+=v*0.01}readout.innerText=`X: ${x.toFixed(3)} | V: ${v.toFixed(3)} | ΔE: ${(b*b/(4*a)).toFixed(2)}`;draw()}function draw(){ctx.clearRect(0,0,600,300);ctx.strokeStyle='#555';ctx.beginPath();ctx.moveTo(0,150);ctx.lineTo(600,150);ctx.stroke();ctx.strokeStyle='#0af';ctx.lineWidth=2;ctx.beginPath();for(let px=-3;px<=3;px+=0.1){let py=getV(px);ctx.lineTo(300+px*80,250-py*20)}ctx.stroke();ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(300+x*80,250-getV(x)*20-5,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText("0 State",100,280);ctx.fillText("1 State",460,280)}document.getElementById('reset').onclick=()=>{x=-Math.sqrt(b/(2*a));v=0};setInterval(update,16);</script></body></html>
