<!DOCTYPE html><html><head><style>body{background:#000;color:#0f0;font-family:monospace;display:flex;flex-direction:column;align-items:center}canvas{border:1px solid #0f0;margin:10px}.ui{background:#111;padding:15px;border:1px solid #333;width:600px}label{display:inline-block;width:150px}.btn{background:#0f0;color:#000;border:none;padding:10px;cursor:pointer;font-weight:bold;margin-top:10px}</style></head><body><h2>Phase-Space Spiral: Ringing Failure</h2><canvas id="cvs" width="600" height="300"></canvas><div class="ui"><div><label>Damping (ζ):</label><input type="range" id="zR" min="0" max="0.5" step="0.01" value="0.1"><span id="zV">0.10</span></div><div><label>Pulse Force:</label><input type="range" id="fR" min="0" max="1.5" step="0.1" value="0.7"><span id="fV">0.7</span></div><button class="btn" onclick="runSim()">TRIGGER BIT FLIP</button><div id="out" style="margin-top:10px;color:#0af"></div></div><script>const cvs=document.getElementById('cvs'),ctx=cvs.getContext('2d');let x=-1,v=0,t=0,path=[],simming=false;function runSim(){x=-1;v=0;t=0;path=[];simming=true;requestAnimationFrame(step)}function step(){if(!simming)return;const zeta=parseFloat(document.getElementById('zR').value);const f_ext=(t>5&&t<15)?parseFloat(document.getElementById('fR').value):0;for(let i=0;i<5;i++){const dxdt=v;const dvdt=x-Math.pow(x,3)-2*zeta*v+f_ext;x+=dxdt*0.05;v+=dvdt*0.05;t+=0.05;path.push({x,v});if(path.length>1000)path.shift()}ctx.fillStyle='black';ctx.fillRect(0,0,600,300);ctx.strokeStyle='#222';ctx.beginPath();ctx.moveTo(0,150);ctx.lineTo(600,150);ctx.moveTo(300,0);ctx.lineTo(300,300);ctx.stroke();ctx.strokeStyle='#0f0';ctx.beginPath();path.forEach((p,i)=>{const px=300+p.x*100;const py=150-p.v*50;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)});ctx.stroke();ctx.fillStyle='#f0f';ctx.beginPath();ctx.arc(300+x*100,150-v*50,5,0,7);ctx.fill();document.getElementById('zV').innerText=zeta.toFixed(2);document.getElementById('fV').innerText=f_ext.toFixed(1);document.getElementById('out').innerText=`Position: ${x.toFixed(3)} | State: ${x>0?'LOGIC 1':'LOGIC 0'}`;if(t>150)simming=false;else requestAnimationFrame(step)}runSim();</script></body></html>
