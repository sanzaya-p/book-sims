<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:#000;border:1px solid #444;image-rendering:pixelated;width:600px;height:200px}.controls{background:#222;padding:15px;border-radius:8px;margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;width:600px}.slider-group{display:flex;flex-direction:column}label{font-size:12px;margin-bottom:5px;color:#aaa}input[type=range]{width:100%}.metrics{margin-top:10px;font-family:monospace;font-size:14px;color:#0f0}button{grid-column:span 2;padding:10px;background:#444;color:#fff;border:none;border-radius:4px;cursor:pointer}button:hover{background:#555}</style></head><body><h2>SIMP Topology: The Power of p</h2><canvas id="simCanvas"></canvas><div class="controls"><div class="slider-group"><label>Penalization (p): <span id="pVal">3.0</span></label><input type="range" id="pRange" min="1" max="5" step="0.1" value="3"></div><div class="slider-group"><label>Filter Radius (r): <span id="rVal">1.5</span></label><input type="range" id="rRange" min="0.5" max="4" step="0.1" value="1.5"></div><button id="resetBtn">Reset & Optimize</button></div><div class="metrics" id="stats">Iter: 0 | Binary Score: 0.000</div><script>const canvas=document.getElementById('simCanvas'),ctx=canvas.getContext('2d'),nx=60,ny=20;canvas.width=nx;canvas.height=ny;let x=new Array(nx*ny).fill(0.5);let iter=0;const pIn=document.getElementById('pRange'),rIn=document.getElementById('rRange'),pOut=document.getElementById('pVal'),rOut=document.getElementById('rVal'),stat=document.getElementById('stats');function getSens(dens,p){const sens=new Array(nx*ny);for(let i=0;i<ny;i++){for(let j=0;j<nx;j++){const dist=j/nx;const strain=(1.0-dist)**2*(1.0+0.4*Math.sin((i/ny)*Math.PI));sens[i*nx+j]=-p*Math.pow(dens[i*nx+j],p-1)*strain}}return sens}function step(){const p=parseFloat(pIn.value);const r=parseFloat(rIn.value);pOut.textContent=p.toFixed(1);rOut.textContent=r.toFixed(1);const sens=getSens(x,p);let l1=0,l2=1e6;for(let b=0;b<20;b++){let mid=(l1+l2)/2;let vol=0;for(let k=0;k<nx*ny;k++){vol+=Math.max(0.001,Math.min(1.0,x[k]*Math.sqrt(-sens[k]/mid)))}if(vol/(nx*ny)>0.4)l1=mid;else l2=mid}let totalDiff=0;for(let k=0;k<nx*ny;k++){const nextX=Math.max(0.001,Math.min(1.0,x[k]*Math.sqrt(-sens[k]/l2)));totalDiff+=Math.abs(nextX-x[k]);x[k]=nextX}let binary=0;for(let k=0;k<nx*ny;k++)binary+=x[k]*(1-x[k])*4/(nx*ny);iter++;stat.textContent=`Iter: ${iter} | Binary Score: ${binary.toFixed(4)}`;draw()}function draw(){const img=ctx.createImageData(nx,ny);for(let i=0;i<nx*ny;i++){const val=x[i]*255;img.data[i*4]=val;img.data[i*4+1]=val;img.data[i*4+2]=val;img.data[i*4+3]=255}ctx.putImageData(img,0,0)}document.getElementById('resetBtn').onclick=()=>{x.fill(0.5);iter=0};setInterval(step,50);</script></body></html>
