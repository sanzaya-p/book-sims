<!DOCTYPE html><html><head><style>body{background:#0a0a0a;color:#0f0;font-family:monospace;margin:0;padding:20px;text-align:center}canvas{background:#000;border:2px solid #0f0;box-shadow:0 0 20px #040;margin:20px}#ui{background:#111;padding:20px;border-radius:10px;display:inline-block}.ctrl{margin:10px;display:flex;justify-content:space-between;width:400px}input{width:200px}</style></head><body><h1>AMOLF Energy Landscape Sculptor</h1><div id="ui"><div class="ctrl"><label>Barrier Height (Stiffness)</label><input type="range" id="kRange" min="0.5" max="5" step="0.1" value="2"></div><div class="ctrl"><label>Coupling Strength</label><input type="range" id="gRange" min="0.1" max="2" step="0.1" value="0.8"></div><div class="ctrl"><label>Non-Reciprocity (β)</label><input type="range" id="bRange" min="0" max="1" step="0.05" value="0.2"></div><button onclick="trigger()" style="padding:10px 20px;cursor:pointer">TRIGGER INPUT PULSE</button></div><br><canvas id="chainCanvas" width="800" height="200"></canvas><script>const canvas=document.getElementById('chainCanvas');const ctx=canvas.getContext('2d');let n=12;let x=new Array(n).fill(-1);let v=new Array(n).fill(0);let drive=0;function trigger(){drive=15;}function update(){let k=parseFloat(document.getElementById('kRange').value);let g=parseFloat(document.getElementById('gRange').value);let b=parseFloat(document.getElementById('bRange').value);let dt=0.03;for(let sub=0;sub<5;sub++){let nextV=[...v];for(let i=0;i<n;i++){let fWell=k*(x[i]-Math.pow(x[i],3));let fCouple=0;if(i<n-1){let d=x[i+1]-x[i];fCouple+=g*d+b*d*d;}if(i>0){let d=x[i-1]-x[i];fCouple+=g*d-b*d*d;}let fInput=(i===0)?drive:0;let fDamp=-0.5*v[i];nextV[i]+=(fWell+fCouple+fInput+fDamp)*dt;}v=nextV;for(let i=0;i<n;i++)x[i]+=v[i]*dt;}drive*=0.85;if(drive<0.1)drive=0;}function draw(){update();ctx.clearRect(0,0,800,200);for(let i=0;i<n;i++){let cx=(i+1)*800/(n+1);let cy=100+x[i]*40;ctx.strokeStyle='#0f0';ctx.beginPath();ctx.arc(cx,cy,15,0,Math.PI*2);ctx.stroke();if(x[i]>0){ctx.fillStyle='rgba(0,255,0,0.3)';ctx.fill();}ctx.beginPath();ctx.moveTo(cx,100-50);ctx.lineTo(cx,100+50);ctx.strokeStyle='#222';ctx.stroke();if(i<n-1){ctx.beginPath();ctx.moveTo(cx+15,cy);ctx.lineTo((i+2)*800/(n+1)-15,100+x[i+1]*40);ctx.strokeStyle='#050';ctx.stroke();}}requestAnimationFrame(draw);}draw();</script></body></html>
