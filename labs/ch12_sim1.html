<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:#222;border:1px solid #444;margin-top:20px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:600px;background:#333;padding:15px;border-radius:8px}.slider-group{display:flex;flex-direction:column}label{font-size:0.8em;margin-bottom:5px;color:#aaa}span{font-weight:bold;color:#0af}.metric-box{margin-top:15px;padding:10px;background:#000;border-radius:4px;width:600px;display:flex;justify-content:space-around}</style></head><body><h2>Ch12: TPU Arch Master Curve</h2><div class="controls"><div class="slider-group"><label>Dimensionless Height (h/t): <span id="hVal">3.5</span></label><input type="range" id="hSlide" min="1" max="6" step="0.1" value="3.5"></div><div class="slider-group"><label>TPU Softening (Alpha): <span id="aVal">0.85</span></label><input type="range" id="aSlide" min="0.5" max="1" step="0.05" value="0.85"></div></div><div class="metric-box"><div>State: <span id="stateTag">--</span></div><div>Snap Force: <span id="snapForce">--</span></div><div>Reset Force: <span id="resetForce">--</span></div></div><canvas id="plot" width="600" height="400"></canvas><script>const canvas=document.getElementById('plot');const ctx=canvas.getContext('2d');const hSlide=document.getElementById('hSlide');const aSlide=document.getElementById('aSlide');function draw(){const h=parseFloat(hSlide.value);const a=parseFloat(aSlide.value);document.getElementById('hVal').innerText=h;document.getElementById('aVal').innerText=a;ctx.clearRect(0,0,600,400);ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(50,200);ctx.lineTo(550,200);ctx.stroke();ctx.beginPath();ctx.moveTo(50,50);ctx.lineTo(50,350);ctx.stroke();let points=[];let maxF=-Infinity;let minF=Infinity;for(let u=0;u<=2.1;u+=0.02){const termB=(h*h)*(u-1.5*u*u+0.5*u*u*u);const termL=u;const soft=1-(1-a)*Math.sin(Math.PI*u/2);const f=soft*(termB+termL);points.push({u,f});if(f>maxF)maxF=f;if(f<minF)minF=f;}ctx.strokeStyle='#0af';ctx.lineWidth=3;ctx.beginPath();points.forEach((p,i)=>{const x=50+p.u*200;const y=200-p.f*10;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();document.getElementById('snapForce').innerText=maxF.toFixed(2);document.getElementById('resetForce').innerText=minF.toFixed(2);const bistable=minF<0;document.getElementById('stateTag').innerText=bistable?"BISTABLE":"MONOSTABLE";document.getElementById('stateTag').style.color=bistable?"#0f0":"#f00";ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText('Normalized Displacement (u)',250,380);ctx.save();ctx.translate(20,250);ctx.rotate(-Math.PI/2);ctx.fillText('Normalized Force (F_bar)',0,0);ctx.restore();}hSlide.oninput=draw;aSlide.oninput=draw;draw();</script></body></html>
