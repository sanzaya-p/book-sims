<!DOCTYPE html><html><head><style>body{font-family:sans-serif;background:#121212;color:#eee;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:#1e1e1e;border:1px solid #444;margin:10px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:600px;background:#252525;padding:20px;border-radius:8px}.slider-group{display:flex;flex-direction:column}label{font-size:0.8em;color:#aaa;margin-bottom:5px}.val{color:#0f0;font-weight:bold}.gauge-container{display:flex;gap:40px;margin-top:10px}</style></head><body><h2>Paris Law: The Prophetic Crack</h2><div class="controls"><div class="slider-group"><label>Stress Range (Δσ): <span id="v-ds" class="val">100</span> MPa</label><input type="range" id="ds" min="50" max="300" value="120"></div><div class="slider-group"><label>Paris Exponent (m): <span id="v-m" class="val">3.0</span></label><input type="range" id="m" min="2" max="5" step="0.1" value="3.2"></div><div class="slider-group"><label>Initial Crack (a0): <span id="v-a0" class="val">0.5</span> mm</label><input type="range" id="a0" min="0.1" max="2" step="0.1" value="0.5"></div><div class="slider-group"><button onclick="location.reload()">Restart Integration</button></div></div><div class="gauge-container"><div><canvas id="beam" width="280" height="150"></canvas><center>Crack Visualization</center></div><div><canvas id="freq" width="280" height="150"></canvas><center>Frequency Signal (f/f0)</center></div></div><div id="stats" style="font-family:monospace; margin-top:15px; color:#0f0"></div><script>const c1=document.getElementById('beam'), ctx1=c1.getContext('2d');const c2=document.getElementById('freq'), ctx2=c2.getContext('2d');let n=0, a=0.5, f=1.0;const AF=6.0, C=2e-11, Y=1.12;function update(){const ds=parseFloat(document.getElementById('ds').value);const m=parseFloat(document.getElementById('m').value);document.getElementById('v-ds').innerText=ds;document.getElementById('v-m').innerText=m;document.getElementById('v-a0').innerText=document.getElementById('a0').value;const dk=Y*ds*Math.sqrt(Math.PI*(a/1000));const dadn=C*Math.pow(dk,m);const step=500;a+=dadn*step*1000;n+=step;f=Math.sqrt(Math.pow((AF*1.5-a)/(AF*1.5),3));draw();if(a<AF)requestAnimationFrame(update);else document.getElementById('stats').innerText="FAILURE AT N=" + n.toExponential(2);}function draw(){ctx1.clearRect(0,0,280,150);ctx1.fillStyle='#444';ctx1.fillRect(20,60,240,30);ctx1.fillStyle='#f00';ctx1.fillRect(140,60,2,a*10);ctx2.clearRect(0,0,280,150);ctx2.strokeStyle='#0f0';ctx2.lineWidth=3;ctx2.beginPath();ctx2.arc(140,130,100,Math.PI,Math.PI*(1+f));ctx2.stroke();ctx2.fillStyle='#eee';ctx2.fillText("Frequency: "+(f*100).toFixed(1)+"%",110,120);document.getElementById('stats').innerText="Cycles: "+n.toExponential(2)+" | Crack: "+a.toFixed(2)+"mm";}a=parseFloat(document.getElementById('a0').value);update();</script></body></html>
