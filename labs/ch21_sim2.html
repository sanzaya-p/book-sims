<!DOCTYPE html><html><head><style>body{font-family:sans-serif;background:#121212;color:#eee;display:flex;flex-direction:column;align-items:center;padding:20px}.card{background:#1e1e1e;border:1px solid #333;padding:20px;border-radius:12px;width:650px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}.stat-row{display:flex;justify-content:space-between;margin:10px 0;padding:10px;background:#252525;border-radius:6px}.label{color:#888;font-size:0.9em}canvas{background:#000;border:1px solid #444;width:100%;height:300px;margin-top:15px}.slider-ctrl{width:100%;margin:10px 0}.val{color:#ff9800;font-weight:bold}#status{font-weight:bold;padding:5px 10px;border-radius:4px}</style></head><body><div class="card"><h3>Thermodynamic Sintering Window</h3><div class="stat-row"><div class="label">Current Energy Density: <span class="val" id="ed_val">0</span> J/mm&sup3;</div><div class="label">Residual Stress: <span class="val" id="rs_val">0</span> MPa</div></div><div style="margin:15px 0"><label>Laser Power (Watts): <span id="p_label">20</span>W</label><input type="range" id="p_range" class="slider-ctrl" min="5" max="50" value="20"><label>Scan Speed (mm/s): <span id="v_label">1000</span>mm/s</label><input type="range" id="v_range" class="slider-ctrl" min="200" max="3000" value="1000"><label>Cooling Delta-T (K): <span id="dt_label">180</span>K</label><input type="range" id="dt_range" class="slider-ctrl" min="50" max="300" value="180"></div><div id="status" style="text-align:center">SYSTEM INITIALIZING...</div><canvas id="mapCanvas"></canvas></div><script>const canvas=document.getElementById('mapCanvas');const ctx=canvas.getContext('2d');const pR=document.getElementById('p_range');const vR=document.getElementById('v_range');const dtR=document.getElementById('dt_range');const nylon={tm:8,td:12,alpha:110,e:1500};const tpu={tm:7,td:10.5,alpha:180,e:100};function update(){const P=parseFloat(pR.value);const V=parseFloat(vR.value);const DT=parseFloat(dtR.value);document.getElementById('p_label').innerText=P;document.getElementById('v_label').innerText=V;document.getElementById('dt_label').innerText=DT;const Ed=P/(V*0.1*0.1);document.getElementById('ed_val').innerText=Ed.toFixed(2);const e_eff=(nylon.e*tpu.e)/(nylon.e+tpu.e);const res_stress=e_eff*Math.abs(nylon.alpha-tpu.alpha)*1e-6*DT;document.getElementById('rs_val').innerText=res_stress.toFixed(2);const stat=document.getElementById('status');const nylonOk=Ed>=nylon.tm&&Ed<=nylon.td;const tpuOk=Ed>=tpu.tm&&Ed<=tpu.td;if(nylonOk&&tpuOk){stat.innerText="PROCESS WINDOW: OPTIMAL";stat.style.background="#2e7d32";}else if(nylonOk||tpuOk){stat.innerText="PROCESS WINDOW: PARTIAL MELT / DEGRADATION";stat.style.background="#f57c00";}else{stat.innerText="PROCESS WINDOW: FAILURE";stat.style.background="#c62828";}ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#333';ctx.fillRect(0,0,canvas.width,canvas.height);const drawWindow=(mat,color,y)=>{const x_start=(mat.tm/20)*canvas.width;const x_end=(mat.td/20)*canvas.width;ctx.fillStyle=color;ctx.globalAlpha=0.4;ctx.fillRect(x_start,y,x_end-x_start,50);ctx.globalAlpha=1.0;ctx.fillStyle='#fff';ctx.font='10px Arial';ctx.fillText(mat.name,x_start,y-5);};drawWindow(nylon,'#2196f3',100);drawWindow(tpu,'#9c27b0',180);const currentX=(Ed/20)*canvas.width;ctx.strokeStyle='#ff9800';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(currentX,50);ctx.lineTo(currentX,250);ctx.stroke();ctx.fillStyle='#ff9800';ctx.fillText('Operating Point',currentX-30,45);if(res_stress>2.5){ctx.fillStyle='#f44336';ctx.font='14px Arial';ctx.fillText('WARNING: CTE MISMATCH POP-OFF RISK',canvas.width/2-120,280);}}pR.oninput=vR.oninput=dtR.oninput=update;update();</script></body></html>
