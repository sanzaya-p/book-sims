<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:#222;border:1px solid #444;margin:20px}#controls{background:#333;padding:15px;border-radius:8px;width:400px}.slider-group{margin:10px 0}label{display:block;font-size:0.8em;color:#aaa}input{width:100%}.metric{font-weight:bold;color:#0f0}#status{font-size:1.2em;margin-top:10px;text-align:center}</style></head><body><h2>The Intrinsic Evaporation of Logic</h2><div id="controls"><div class="slider-group"><label>Temperature (K): <span id="tVal" class="metric">300</span></label><input type="range" id="tSlider" min="200" max="800" value="300"></div><div class="slider-group"><label>Channel Doping (cm⁻³): 10^<span id="dVal" class="metric">15</span></label><input type="range" id="dSlider" min="12" max="18" step="0.1" value="15"></div><div id="status">Status: <span id="statusMsg">NORMAL</span></div></div><canvas id="plot" width="500" height="300"></canvas><script>const canvas=document.getElementById('plot');const ctx=canvas.getContext('2d');const tSlider=document.getElementById('tSlider');const dSlider=document.getElementById('dSlider');const tDisp=document.getElementById('tVal');const dDisp=document.getElementById('dVal');const statusMsg=document.getElementById('statusMsg');function getNi(T){const k=8.617e-5;const Eg=1.12;const pre=(2e19)*(Math.pow(T/300,1.5));return pre*Math.exp(-Eg/(2*k*T))}function draw(){const T=parseFloat(tSlider.value);const D=Math.pow(10,parseFloat(dSlider.value));const ni=getNi(T);tDisp.innerText=T;dDisp.innerText=parseFloat(dSlider.value).toFixed(1);ctx.clearRect(0,0,500,300);ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(50,250);ctx.lineTo(450,250);ctx.stroke();ctx.beginPath();ctx.moveTo(50,250);ctx.lineTo(50,50);ctx.stroke();ctx.strokeStyle='#0f0';ctx.beginPath();for(let x=0;x<400;x++){const tx=200+(x/400)*600;const ny=Math.log10(getNi(tx));const py=250-((ny-5)/15)*200;if(x===0)ctx.moveTo(50+x,py);else ctx.lineTo(50+x,py)}ctx.stroke();const curLogNi=Math.log10(ni);const curY=250-((curLogNi-5)/15)*200;const dopY=250-((Math.log10(D)-5)/15)*200;ctx.fillStyle='red';ctx.beginPath();ctx.arc(50+((T-200)/600)*400,curY,5,0,Math.PI*2);ctx.fill();ctx.setLineDash([5,5]);ctx.strokeStyle='cyan';ctx.beginPath();ctx.moveTo(50,dopY);ctx.lineTo(450,dopY);ctx.stroke();ctx.setLineDash([]);if(ni>D){statusMsg.innerText='INTRINSIC FAILURE';statusMsg.style.color='red'}else{statusMsg.innerText='OPERATIONAL';statusMsg.style.color='#0f0'}requestAnimationFrame(draw)}tSlider.oninput=dSlider.oninput=draw;draw()</script></body></html>
