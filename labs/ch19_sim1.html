<!DOCTYPE html>
<html>
<head>
    <title>m-EDA Bistable Logic Gate</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #eee; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        canvas { background: #000; border: 1px solid #444; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; background: #2a2a2a; padding: 20px; border-radius: 8px; width: 600px; }
        .control-group { display: flex; flex-direction: column; }
        label { font-size: 0.8em; margin-bottom: 5px; color: #aaa; }
        .metrics { margin-top: 20px; font-family: monospace; font-size: 1.1em; color: #0f0; }
        input[type=range] { cursor: pointer; }
    </style>
</head>
<body>
    <h3>Bistable Potential Well (m-HDL Logic Primitive)</h3>
    <canvas id="plot" width="600" height="400"></canvas>
    <div class="controls">
        <div class="control-group">
            <label>Linear Stiffness (k): <span id="kv">-10</span></label>
            <input type="range" id="k" min="-20" max="20" step="0.1" value="-10">
        </div>
        <div class="control-group">
            <label>Non-linear Coeff (&alpha;): <span id="av">1.0</span></label>
            <input type="range" id="alpha" min="0.1" max="5" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label>Control Force (F_ext): <span id="fv">0.0</span></label>
            <input type="range" id="fext" min="-20" max="20" step="0.1" value="0">
        </div>
        <div class="control-group">
            <label>Damping (&eta;): <span id="dv">0.1</span></label>
            <input type="range" id="damping" min="0.01" max="0.5" step="0.01" value="0.1">
        </div>
    </div>
    <div class="metrics" id="status">Logic State: Bifurcated</div>

    <script>
        const canvas = document.getElementById('plot');
        const ctx = canvas.getContext('2d');
        
        let state = { q: -3.0, v: 0.0 };
        
        function getParams() {
            return {
                k: parseFloat(document.getElementById('k').value),
                alpha: parseFloat(document.getElementById('alpha').value),
                fext: parseFloat(document.getElementById('fext').value),
                damping: parseFloat(document.getElementById('damping').value)
            };
        }

        function V(q, p) {
            return 0.5 * p.k * Math.pow(q, 2) + 0.25 * p.alpha * Math.pow(q, 4) - p.fext * q;
        }

        function force(q, p) {
            return -(p.k * q + p.alpha * Math.pow(q, 3) - p.fext);
        }

        function update() {
            const p = getParams();
            document.getElementById('kv').innerText = p.k;
            document.getElementById('av').innerText = p.alpha;
            document.getElementById('fv').innerText = p.fext;
            document.getElementById('dv').innerText = p.damping;

            // Physics step (Euler-Cromer)
            const dt = 0.1;
            const f = force(state.q, p);
            state.v += (f - p.damping * state.v) * dt;
            state.q += state.v * dt;

            draw(p);
            requestAnimationFrame(update);
        }

        function draw(p) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Axis
            ctx.strokeStyle = '#333';
            ctx.beginPath(); ctx.moveTo(0, 350); ctx.lineTo(600, 350); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(300, 400); ctx.stroke();

            // Draw Potential Curve
            ctx.strokeStyle = '#4a90e2';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = -6; x <= 6; x += 0.1) {
                let energy = V(x, p);
                let px = 300 + x * 50;
                let py = 300 - energy * 5;
                if (x === -6) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();

            // Draw Logic Gate Ball
            let bx = 300 + state.q * 50;
            let by = 300 - V(state.q, p) * 5;
            ctx.fillStyle = '#ff3b3b';
            ctx.beginPath();
            ctx.arc(bx, by, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 15; ctx.shadowColor = "red";
            
            // Logic Status check
            if (p.k >= 0) {
                document.getElementById('status').innerText = "Logic State: Linear (0)";
            } else {
                document.getElementById('status').innerText = state.q > 0 ? "Logic State: High (1)" : "Logic State: Low (0)";
            }
        }

        update();
    </script>
</body>
</html>
