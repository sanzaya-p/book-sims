<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:#222;border:1px solid #444;margin:20px 0}.controls{display:grid;grid-template-columns:120px 200px 80px;gap:15px;align-items:center;background:#333;padding:20px;border-radius:8px}.label{font-weight:bold;color:#0af}#metrics{margin-top:20px;font-family:monospace;color:#0f0}</style></head><body><h2>The Logic Window: Q-Factor Scaling</h2><canvas id="plot" width="600" height="400"></canvas><div class="controls"><div class="label">Q-Factor:</div><input type="range" id="qRange" min="0" max="10" step="0.1" value="4"><span id="qVal">4.0</span><div class="label">Asymmetry (ε):</div><input type="range" id="eRange" min="-2" max="2" step="0.1" value="0"><span id="eVal">0.0</span></div><div id="metrics"></div><script>const canvas=document.getElementById('plot'),ctx=canvas.getContext('2d');const qInput=document.getElementById('qRange'),eInput=document.getElementById('eRange');function draw(){const Q=parseFloat(qInput.value),E=parseFloat(eInput.value);document.getElementById('qVal').innerText=Q.toFixed(1);document.getElementById('eVal').innerText=E.toFixed(1);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(0,200);ctx.lineTo(600,200);ctx.moveTo(300,0);ctx.lineTo(300,400);ctx.stroke();ctx.strokeStyle='#0af';ctx.lineWidth=3;ctx.beginPath();let p_sn=-Infinity,p_sb=Infinity;for(let x=0;x<=600;x++){const delta=(x-300)/100;const force=Math.pow(delta,3)-Q*delta+E;const y=200-force*40;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);const slope=3*delta*delta-Q;if(Math.abs(slope)<0.05){if(delta<0)p_sn=force;else p_sb=force;ctx.fillStyle='#f00';ctx.fillRect(x-4,y-4,8,8)}}ctx.stroke();const logicWidth=p_sn-p_sb;const isBistable=p_sn>0&&p_sb<0;document.getElementById('metrics').innerHTML=`Snap-Through (P_sn): ${p_sn.toFixed(2)}<br>Snap-Back (P_sb): ${p_sb.toFixed(2)}<br>Hysteresis Moat: ${logicWidth.toFixed(2)}<br>Status: ${isBistable?'BISTABLE MEMORY':'VOLATILE (LOGIC ERROR)'}`}qInput.oninput=eInput.oninput=draw;draw();</script></body></html>
