<!DOCTYPE html><html><head><style>body{font-family:sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:#222;border:1px solid #444;margin:20px}.controls{background:#333;padding:15px;border-radius:8px;width:400px}label{display:block;margin-bottom:10px}input{width:100%}.stat{font-family:monospace;color:#0f0;margin-top:10px}</style></head><body><h3>Maxwell Rigidity Visualizer</h3><div class="controls"><label>Average Connectivity (Z): <span id="zVal">3.5</span><input type="range" id="zRange" min="3" max="12" step="0.1" value="3.5"></label><label>Relative Density (ρ): <span id="rVal">0.10</span><input type="range" id="rRange" min="0.01" max="0.3" step="0.01" value="0.1"></label></div><canvas id="simCanvas" width="400" height="300"></canvas><div class="stat" id="outputs">Regime: Bending-Dominated<br>E_eff ∝ ρ^2.3</div><script>const canvas=document.getElementById('simCanvas');const ctx=canvas.getContext('2d');const zRange=document.getElementById('zRange');const rRange=document.getElementById('rRange');function draw(){const z=parseFloat(zRange.value);const r=parseFloat(rRange.value);document.getElementById('zVal').innerText=z.toFixed(1);document.getElementById('rVal').innerText=r.toFixed(2);ctx.clearRect(0,0,400,300);const Zc=6;const exponent=z>=Zc?1:1+2*(1-z/Zc);const eEff=Math.pow(r,exponent);document.getElementById('outputs').innerHTML=`Regime: ${z>=Zc?'Stretching-Dominated':'Bending-Dominated'}<br>Scaling Exponent: ${exponent.toFixed(2)}<br>Normalized Stiffness: ${eEff.toExponential(3)}`;ctx.strokeStyle=z>=Zc?'#0f0':'#f00';ctx.lineWidth=r*50;const spacing=40;for(let x=40;x<360;x+=spacing){for(let y=40;y<260;y+=spacing){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+spacing,y);ctx.lineTo(x,y+spacing);if(z>4)ctx.lineTo(x+spacing,y+spacing);if(z>6){ctx.moveTo(x+spacing,y);ctx.lineTo(x,y+spacing);}ctx.stroke();}}ctx.fillStyle='#fff';ctx.fillText("Unit Cell Mesh Visualization",10,20)}zRange.oninput=draw;rRange.oninput=draw;draw();</script></body></html>
