<!DOCTYPE html><html><head><style>body{background:#0f172a;color:#f8fafc;font-family:system-ui;text-align:center;padding:20px;}canvas{background:#1e293b;border-radius:12px;box-shadow:0 10px 15px -3px rgba(0,0,0,0.5);}#controls{display:flex;justify-content:center;gap:30px;margin:20px;}.card{background:#334155;padding:15px;border-radius:8px;width:220px;}input[type=range]{width:100%;cursor:pointer;}button{padding:10px 20px;font-weight:bold;background:#38bdf8;border:none;border-radius:5px;cursor:pointer;margin-top:10px;}button:hover{background:#0ea5e9;}</style></head><body><h1>Ch 13: Stiffness Ratio Stability</h1><canvas id="sim" width="800" height="300"></canvas><div id="controls"><div class="card"><label>Arch Stiffness ($K_{arch}$)</label><br><input type="range" id="ka" min="100" max="1000" value="500"><br><span id="vka">500</span> N/mm</div><div class="card"><label>Link Stiffness ($K_{link}$)</label><br><input type="range" id="kl" min="50" max="1500" value="250"><br><span id="vkl">250</span> N/mm</div><div class="card"><label>$\lambda = K_L/K_A$</label><br><h2 id="vlam">0.50</h2><span id="status">UNSTABLE</span></div></div><button onclick="trigger()">Trigger Gate 1</button><script>const canvas=document.getElementById('sim'),ctx=canvas.getContext('2d');let state={g1:0,g2:0,anim:0,triggering:false};const kaS=document.getElementById('ka'),klS=document.getElementById('kl');function trigger(){state.g1=1;state.anim=0;state.triggering=true;}function draw(){const ka=parseFloat(kaS.value),kl=parseFloat(klS.value),lam=kl/ka;document.getElementById('vka').innerText=ka;document.getElementById('vkl').innerText=kl;document.getElementById('vlam').innerText=lam.toFixed(2);const status=document.getElementById('status');status.innerText=lam>=1?"STABLE":"ISCHEMIC";status.style.color=lam>=1?"#4ade80":"#f87171";ctx.clearRect(0,0,800,300);function drawArch(x,y,snapped,label){ctx.strokeStyle=snapped?"#38bdf8":"#64748b";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-40,y);if(snapped){ctx.quadraticCurveTo(x,y+40,x+40,y);}else{ctx.quadraticCurveTo(x,y-40,x+40,y);}ctx.stroke();ctx.fillStyle="#f8fafc";ctx.fillText(label,x-20,y+60);}const g1x=200,g2x=600,cy=150;if(state.triggering){state.anim+=0.02;if(state.anim>1){state.anim=1;if(lam>=1)state.g2=1;state.triggering=false;}}const linkDef=state.g1? (state.g2? 0 : (lam < 1 ? 40*state.anim : 0)) : 0;ctx.strokeStyle="#94a3b8";ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(g1x+40,cy);ctx.lineTo(g2x-40,cy+linkDef);ctx.stroke();ctx.setLineDash([]);drawArch(g1x,cy,state.g1,"Gate 1");drawArch(g2x,cy,state.g2,"Gate 2");if(state.triggering){ctx.fillStyle="#38bdf8";ctx.beginPath();ctx.arc(g1x+40+(g2x-g1x-80)*state.anim,cy+linkDef*state.anim,5,0,7);ctx.fill();}requestAnimationFrame(draw);}draw();</script></body></html>
