<!DOCTYPE html>
<html>
<head>
    <title>Q-Factor Cliff Simulation</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 800px; border: 1px solid #333; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .control-group { display: flex; flex-direction: column; }
        label { font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #4CAF50; }
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .metric-box { background: #252525; padding: 15px; border-radius: 8px; text-align: center; border-bottom: 4px solid #444; }
        .metric-value { font-size: 1.8rem; font-weight: bold; display: block; }
        .metric-label { font-size: 0.75rem; text-transform: uppercase; color: #888; }
        canvas { width: 100%; height: 300px; background: #000; border-radius: 8px; margin: 20px 0; }
        .bistable { border-color: #4CAF50; }
        .failed { border-color: #f44336; }
    </style>
</head>
<body>
    <div class="card">
        <h2>The Q-Factor Cliff</h2>
        <div class="controls">
            <div class="control-group">
                <label>Nominal Thickness (h): <span id="hVal">0.60</span> mm</label>
                <input type="range" id="hSlide" min="0.3" max="1.0" step="0.01" value="0.60">
            </div>
            <div class="control-group">
                <label>Thickness Noise (σ): <span id="sVal">0.05</span> mm</label>
                <input type="range" id="sSlide" min="0.01" max="0.15" step="0.01" value="0.05">
            </div>
            <div class="control-group">
                <label>Systemic Bias (μ): <span id="bVal">0.00</span> mm</label>
                <input type="range" id="bSlide" min="-0.15" max="0.15" step="0.01" value="0.0">
            </div>
            <div class="control-group">
                <label>Compression (d): <span id="dVal">1.50</span> mm</label>
                <input type="range" id="dSlide" min="1.0" max="2.0" step="0.05" value="1.50">
            </div>
        </div>

        <canvas id="chart"></canvas>

        <div class="metrics">
            <div class="metric-box" id="yieldBox">
                <span class="metric-label">System Yield</span>
                <span class="metric-value" id="yieldVal">0%</span>
            </div>
            <div class="metric-box">
                <span class="metric-label">Avg. Q-Factor</span>
                <span class="metric-value" id="avgQ">0.0</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('chart');
        const ctx = canvas.getContext('2d');
        const inputs = ['hSlide', 'sSlide', 'bSlide', 'dSlide'];
        
        function update() {
            const h_nom = parseFloat(document.getElementById('hSlide').value);
            const sigma = parseFloat(document.getElementById('sSlide').value);
            const bias = parseFloat(document.getElementById('bSlide').value);
            const d = parseFloat(document.getElementById('dSlide').value);

            document.getElementById('hVal').innerText = h_nom.toFixed(2);
            document.getElementById('sVal').innerText = sigma.toFixed(2);
            document.getElementById('bVal').innerText = bias.toFixed(2);
            document.getElementById('dVal').innerText = d.toFixed(2);

            const samples = 1000;
            const q_vals = [];
            let functional = 0;

            for(let i=0; i<samples; i++) {
                const u1 = Math.random();
                const u2 = Math.random();
                const z = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
                const h = Math.max(0.01, (h_nom + bias) + z * sigma);
                const q = d / h;
                q_vals.push(q);
                if(q >= 2.31) functional++;
            }

            const yield_pct = (functional / samples) * 100;
            document.getElementById('yieldVal').innerText = yield_pct.toFixed(1) + '%';
            document.getElementById('avgQ').innerText = (q_vals.reduce((a,b)=>a+b, 0)/samples).toFixed(2);
            document.getElementById('yieldBox').className = 'metric-box ' + (yield_pct > 95 ? 'bistable' : 'failed');

            // Draw Histogram
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.width = canvas.offsetWidth * window.devicePixelRatio;
            canvas.height = canvas.offsetHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

            const bins = 40;
            const hist = new Array(bins).fill(0);
            const minQ = 1.0, maxQ = 4.5;
            
            q_vals.forEach(q => {
                const b = Math.floor((q - minQ) / (maxQ - minQ) * bins);
                if(b >= 0 && b < bins) hist[b]++;
            });

            const binWidth = (canvas.offsetWidth - 40) / bins;
            hist.forEach((v, i) => {
                const q = minQ + (i / bins) * (maxQ - minQ);
                ctx.fillStyle = q < 2.31 ? '#f44336' : '#4CAF50';
                const h = (v / samples) * (canvas.offsetHeight - 60) * 10;
                ctx.fillRect(20 + i * binWidth, canvas.offsetHeight - 40 - h, binWidth - 1, h);
            });

            // Threshold Line
            const tx = 20 + ((2.31 - minQ) / (maxQ - minQ)) * (canvas.offsetWidth - 40);
            ctx.strokeStyle = '#fff';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(tx, 10); ctx.lineTo(tx, canvas.offsetHeight - 40);
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.fillText("Q=2.31 (Cliff)", tx + 5, 20);
        }

        inputs.forEach(id => document.getElementById(id).addEventListener('input', update));
        window.addEventListener('resize', update);
        update();
    </script>
</body>
</html>
