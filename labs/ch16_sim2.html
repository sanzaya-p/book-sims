<!DOCTYPE html><html><head><style>body{background:#111;color:#fff;font-family:monospace;text-align:center;}canvas{background:#000;border:2px solid #333;}.ui{padding:20px;background:#222;margin-bottom:10px;}label{margin:10px;display:inline-block;}input{width:150px;}</style></head><body><div class="ui"><h3>Huygens' Phase Lock</h3><label>Detuning (Δf):<br><input type="range" id="df" min="0" max="0.2" step="0.01" value="0.05"><br><span id="dfv">0.05</span></label><label>Coupling (K):<br><input type="range" id="k" min="0" max="0.2" step="0.01" value="0.02"><br><span id="kv">0.02</span></label></div><canvas id="c" width="600" height="300"></canvas><script>const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');let p1=0,p2=0.5,h=[];function draw(){const df=parseFloat(document.getElementById('df').value);const k=parseFloat(document.getElementById('k').value);document.getElementById('dfv').textContent=df;document.getElementById('kv').textContent=k;for(let i=0;i<10;i++){p1+= (1.0 + k*Math.sin(p2-p1))*0.01;p2+= (1.0 + df + k*Math.sin(p1-p2))*0.01;}let diff = (p2-p1)%(2*Math.PI);if(diff > Math.PI) diff-=2*Math.PI;if(diff < -Math.PI) diff+=2*Math.PI;h.push(diff);if(h.length>600)h.shift();ctx.clearRect(0,0,600,300);ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(0,150);ctx.lineTo(600,150);ctx.stroke();ctx.strokeStyle=(Math.abs(h[h.length-1]-h[h.length-20])<0.01)?'#0f0':'#f00';ctx.beginPath();h.forEach((v,i)=>{ctx.lineTo(i,150-v*40);});ctx.stroke();ctx.fillStyle='#fff';ctx.fillText("Phase Difference (Δφ)",10,20);ctx.fillText(Math.abs(h[h.length-1]-h[h.length-20])<0.01?"STATE: LOCKED":"STATE: DRIFTING",10,40);requestAnimationFrame(draw);}draw();</script></body></html>
