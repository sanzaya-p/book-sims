<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;margin:20px;}canvas{background:#000;border:1px solid #444;display:block;margin:10px auto;}.ctrl{text-align:center;margin-bottom:20px;}label{margin:0 10px;font-size:14px;}input[type=range]{vertical-align:middle;}</style></head><body><div class="ctrl"><h2>Van der Pol Phase Space</h2><label>Damping (μ): <input type="range" id="mu" min="0.1" max="6" step="0.1" value="1.0"><span id="muVal">1.0</span></label><label>Initial X: <input type="range" id="x0" min="-3" max="3" step="0.1" value="0.5"><span id="xVal">0.5</span></label><button onclick="resetSim()">Reset</button></div><canvas id="cvs" width="800" height="500"></canvas><script>const canvas=document.getElementById('cvs');const ctx=canvas.getContext('2d');let x=0.5,v=0,mu=1.0,pts=[];function resetSim(){x=parseFloat(document.getElementById('x0').value);v=0;pts=[];}function step(){mu=parseFloat(document.getElementById('mu').value);document.getElementById('muVal').textContent=mu;document.getElementById('xVal').textContent=document.getElementById('x0').value;const dt=0.05;for(let i=0;i<5;i++){let ax=mu*(1-x*x)*v-x;v+=ax*dt;x+=v*dt;}pts.push({x,v});if(pts.length>1000)pts.shift();ctx.clearRect(0,0,800,500);ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(400,0);ctx.lineTo(400,500);ctx.moveTo(0,250);ctx.lineTo(800,250);ctx.stroke();ctx.strokeStyle='#0f0';ctx.beginPath();pts.forEach((p,i)=>{let px=400+p.x*100;let py=250-p.v*50;if(i==0)ctx.moveTo(px,py);else ctx.lineTo(px,py);});ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(400+x*100,250-v*50,5,0,7);ctx.fill();requestAnimationFrame(step);}step();</script></body></html>
