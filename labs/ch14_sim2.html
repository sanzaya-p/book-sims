<!DOCTYPE html><html><head><style>body{background:#1a1a1a;color:#fff;font-family:monospace;display:flex;flex-direction:column;align-items:center;}canvas{background:#000;border:2px solid #333;}.ui{display:grid;grid-template-columns:1fr 1fr;gap:15px;background:#222;padding:20px;border-radius:8px;margin-top:10px;}input{width:150px;}</style></head><body><h2>Ch14: Thermal Noise Margin Crisis</h2><canvas id="wellCanvas" width="500" height="300"></canvas><div class="ui"><div><label>Well Depth (ΔU)</label><br><input type="range" id="dU" min="0.1" max="5" step="0.1" value="2.5"></div><div><label>Temperature (T)</label><br><input type="range" id="temp" min="0.01" max="2" step="0.05" value="0.2"></div><div>Errors Detected: <span id="errCount" style="color:red">0</span></div><div>Stability: <span id="stab">Stable</span></div></div><script>const canvas=document.getElementById('wellCanvas');const ctx=canvas.getContext('2d');let dU=2.5,T=0.2,ballX=-1,flips=0;function drawWell(){ctx.clearRect(0,0,500,300);ctx.strokeStyle='#555';ctx.lineWidth=3;ctx.beginPath();for(let x=-2;x<=2;x+=0.1){let px=250+x*100;let py=250-(dU*(Math.pow(x,4)-2*Math.pow(x,2)));if(x===-2)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.stroke();let noise=(Math.random()-0.5)*T*2;ballX+=noise;if(ballX>0.5 && Math.random()<Math.exp(-dU/T)){ballX=-1;flips++;}if(ballX<-0.5 && Math.random()<Math.exp(-dU/T)){ballX=1;flips++;}ballX=Math.max(-1.8,Math.min(1.8,ballX));let bx=250+ballX*100;let by=250-(dU*(Math.pow(ballX,4)-2*Math.pow(ballX,2)));ctx.fillStyle='#0f0';ctx.beginPath();ctx.arc(bx,by-10,10,0,Math.PI*2);ctx.fill();document.getElementById('errCount').innerText=flips;document.getElementById('stab').innerText=Math.exp(-dU/T)<0.05?'CRYSTALLINE':'CHAOTIC';requestAnimationFrame(drawWell);}document.getElementById('dU').oninput=e=>dU=parseFloat(e.target.value);document.getElementById('temp').oninput=e=>T=parseFloat(e.target.value);drawWell();</script></body></html>
