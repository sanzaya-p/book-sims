<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:#222;border:1px solid #444;margin:20px 0}.controls{display:grid;grid-template-columns:1fr 200px;gap:10px;width:600px;background:#333;padding:20px;border-radius:8px}.val{color:#0f0;font-weight:bold}button{grid-column:span 2;padding:10px;cursor:pointer;background:#444;color:#fff;border:none;border-radius:4px}button:hover{background:#555}</style></head><body><h2>Poroelastic vs. Snap-Through Speed</h2><div class="controls"><label>Tissue Thickness (L): <span id="lVal" class="val">5.0</span> mm</label><input type="range" id="L" min="1" max="20" step="0.5" value="5"><label>Diffusivity (D): <span id="dVal" class="val">1.0</span> mm²/s</label><input type="range" id="D" min="0.1" max="5" step="0.1" value="1"><button onclick="resetSim()">Reset Simulation</button></div><canvas id="simCanvas" width="600" height="300"></canvas><div id="stats" style="width:600px;line-height:1.6"></div><script>const canvas=document.getElementById('simCanvas'),ctx=canvas.getContext('2d');let time=0;function update(){const L=parseFloat(document.getElementById('L').value);const D=parseFloat(document.getElementById('D').value);const tau= (L*L)/D;document.getElementById('lVal').innerText=L;document.getElementById('dVal').innerText=D;ctx.clearRect(0,0,600,300);ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(50,250);ctx.lineTo(550,250);ctx.stroke();const snapTime=0.1;const currentScale=500/Math.max(tau,2);ctx.fillStyle='#555';ctx.fillRect(50,150,tau*currentScale,30);ctx.fillStyle='#0f0';ctx.fillText('Poroelastic Response (Hydraulic)',50,140);ctx.fillStyle='#f00';ctx.fillRect(50,200,snapTime*currentScale,30);ctx.fillStyle='#f55';ctx.fillText('Elastic Snap-Through (Geometric)',50,190);document.getElementById('stats').innerHTML=`<strong>Analysis:</strong><br>Hydraulic Time Constant (τ): ${tau.toFixed(2)}s<br>Actual Snap Time: 0.10s<br>The geometric snap-through is <strong>${(tau/0.1).toFixed(1)}x</strong> faster than fluid flow allows at this scale.`;requestAnimationFrame(update)}function resetSim(){document.getElementById('L').value=5;document.getElementById('D').value=1}update();</script></body></html>
