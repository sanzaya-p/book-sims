<!DOCTYPE html><html><head><style>body{background:#000;color:#0f0;font-family:'Courier New',monospace;padding:20px}canvas{background:#111;border:1px solid #0f0;margin-top:20px}.ctrl-panel{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:600px;background:#222;padding:20px;border-radius:5px}label{font-size:0.7em;text-transform:uppercase}input{width:100%}.stat-box{border:1px solid #0f0;padding:10px;margin-top:20px;width:580px}</style></head><body><h1>Single Event Effect Cross-Section</h1><div class="ctrl-panel"><div class="cell"><label>Threshold LET (LETth): <span id="lthV">5</span></label><input type="range" id="lthS" min="0" max="20" step="0.1" value="5"></div><div class="cell"><label>Width (W): <span id="wV">20</span></label><input type="range" id="wS" min="5" max="50" step="1" value="20"></div><div class="cell"><label>Saturated Sigma: <span id="sV">1e-4</span></label><input type="range" id="sS" min="-6" max="-2" step="0.1" value="-4"></div><div class="cell"><label>Shape (s): <span id="shV">1.5</span></label><input type="range" id="shS" min="0.5" max="3" step="0.1" value="1.5"></div></div><canvas id="chart" width="600" height="300"></canvas><div class="stat-box">Estimated Errors per Orbit: <span id="errRate">0</span></div><script>const cvs=document.getElementById('chart');const ctx=cvs.getContext('2d');const sliders=['lthS','wS','sS','shS'];function drawFit(){const lth=parseFloat(lthS.value);const w=parseFloat(wS.value);const ssat=Math.pow(10,parseFloat(sS.value));const s=parseFloat(shS.value);document.getElementById('lthV').innerText=lth;document.getElementById('wV').innerText=w;document.getElementById('sV').innerText=ssat.toExponential(1);document.getElementById('shV').innerText=s;ctx.clearRect(0,0,600,300);ctx.strokeStyle='#333';for(let i=0;i<6;i++){let x=100*i;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,300);ctx.stroke()}ctx.strokeStyle='#0f0';ctx.lineWidth=2;ctx.beginPath();let totalFluxInt=0;for(let px=0;px<600;px++){let letVal=px/6;let sigma=0;if(letVal>lth){sigma=ssat*(1-Math.exp(-Math.pow((letVal-lth)/w,s)))}let py=280-(sigma/1e-2)*250;if(px===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);totalFluxInt+=sigma*Math.exp(-letVal/10)}ctx.stroke();document.getElementById('errRate').innerText=(totalFluxInt*1000).toFixed(4);requestAnimationFrame(drawFit)}sliders.forEach(id=>document.getElementById(id).oninput=drawFit);drawFit()</script></body></html>
