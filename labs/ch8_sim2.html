<!DOCTYPE html><html><head><style>body{background:#1a1a1a;color:#eee;font-family:monospace;display:flex;flex-direction:column;align-items:center;height:100vh;margin:0;padding:10px;}#ui{background:#2a2a2a;padding:15px;border-radius:10px;width:650px;margin-bottom:10px;}canvas{border:2px solid #555;background:#000;}.slider-group{display:flex;justify-content:space-between;margin:10px 0;}.data-box{display:flex;justify-content:space-around;font-size:1.2em;color:#0f0;margin-top:10px;}.warn{color:#ff4444;font-weight:bold;}</style></head><body><div id="ui"><h3>Geometric Erosion & Well Swallowing</h3><div class="slider-group"><span>Q-Factor (Rise):</span><input type="range" id="qS" min="2.5" max="6" step="0.1" value="4.0"><span id="qV">4.0</span></div><div class="slider-group"><span>Asymmetry (α):</span><input type="range" id="aS" min="0" max="5" step="0.05" value="0.0"><span id="aV">0.0</span></div><div class="data-box"><span>ΔE: <span id="barV">0.00</span></span><span id="msg">STABLE BIT</span></div></div><canvas id="c" width="650" height="350"></canvas><script>const qS=document.getElementById('qS'),aS=document.getElementById('aS'),qV=document.getElementById('qV'),aV=document.getElementById('aV'),barV=document.getElementById('barV'),msg=document.getElementById('msg'),c=document.getElementById('c'),ctx=c.getContext('2d');function getE(a,Q,alpha){return 0.5*a*a+0.5*Q*Q*Math.pow(Math.pow(1-a/Q,2)-1,2)-alpha*a;}function update(){const Q=parseFloat(qS.value),alpha=parseFloat(aS.value);qV.innerText=Q.toFixed(1);aV.innerText=alpha.toFixed(2);ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(0,300);ctx.lineTo(650,300);ctx.stroke();ctx.strokeStyle='#0f0';ctx.lineWidth=2;ctx.beginPath();let min1=Infinity,min2=Infinity,max1=-Infinity;let pts=[];for(let i=0;i<650;i++){const a=(i-200)/50;const e=getE(a,Q,alpha);pts.push({x:i,y:300-e*10});if(i===0)ctx.moveTo(i,300-e*10);else ctx.lineTo(i,300-e*10);}ctx.stroke();let minima=[];for(let i=1;i<pts.length-1;i++){if(pts[i].y > pts[i-1].y && pts[i].y > pts[i+1].y) minima.push(pts[i]);if(pts[i].y < pts[i-1].y && pts[i].y < pts[i+1].y) {ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(pts[i].x,pts[i].y,4,0,7);ctx.fill();max1=pts[i].y;}}if(minima.length>=2){const dE=(minima[0].y-max1)/10;barV.innerText=dE.toFixed(2);msg.innerText="BISTABLE BIT";msg.className="";}else{barV.innerText="0.00";msg.innerText="BIT SWALLOWED!";msg.className="warn";}requestAnimationFrame(update);}update();</script></body></html>
