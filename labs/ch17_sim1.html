<!DOCTYPE html><html><head><style>body{font-family:sans-serif;background:#1a1a1a;color:#eee;display:flex;flex-direction:column;align-items:center;padding:20px;}canvas{background:#000;border:1px solid #444;margin-top:20px;}.controls{display:grid;grid-template-columns:150px 250px 80px;gap:10px;background:#333;padding:15px;border-radius:8px;}.label{font-weight:bold;}.metric{color:#0f0;font-family:monospace;}</style></head><body><h2>Acoustic Horizon Visualizer</h2><div class='controls'><div class='label'>Group Velocity (v<sub>g</sub>)</div><input type='range' id='vg' min='10' max='500' value='100'><span id='vgVal'>100</span><span>m/s</span><div class='label'>Clock Freq (f<sub>clk</sub>)</div><input type='range' id='fclk' min='10' max='2000' value='200'><span id='fclkVal'>200</span><span>Hz</span><div class='label'>Cell Size (L)</div><input type='range' id='lcell' min='0.005' max='0.05' step='0.005' value='0.01'><span id='lcellVal'>0.01</span><span>m</span></div><div style='margin-top:15px;'>Theoretical Max Depth: <span id='dmax' class='metric'>0</span> stages</div><canvas id='simCanvas' width='800' height='200'></canvas><script>const canvas=document.getElementById('simCanvas');const ctx=canvas.getContext('2d');const inputs=['vg','fclk','lcell'];function update(){const vg=parseFloat(document.getElementById('vg').value);const fclk=parseFloat(document.getElementById('fclk').value);const lcell=parseFloat(document.getElementById('lcell').value);document.getElementById('vgVal').innerText=vg;document.getElementById('fclkVal').innerText=fclk;document.getElementById('lcellVal').innerText=lcell;const dmax = vg / (fclk * lcell);document.getElementById('dmax').innerText=dmax.toFixed(2);draw(vg, fclk, lcell, dmax);}function draw(vg, fclk, lcell, dmax){ctx.clearRect(0,0,canvas.width,canvas.height);const t_clock = 1/fclk;const stages = 40;const padding = 40;const spacing = (canvas.width - 2*padding)/stages;for(let i=0; i<stages; i++){const x = padding + i*spacing;const t_prop = (i*lcell)/vg;const isValid = t_prop < t_clock;ctx.fillStyle = isValid ? '#00ff00' : '#ff3300';ctx.fillRect(x, 80, spacing-5, 40);ctx.fillStyle = '#fff';ctx.font = '10px Arial';if(i%5===0) ctx.fillText(i, x, 140);if(i === Math.floor(dmax)){ctx.strokeStyle='#fff';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(x, 20);ctx.lineTo(x, 180);ctx.stroke();ctx.fillText('HORIZON', x+5, 30);ctx.setLineDash([]);}}ctx.fillStyle='#aaa';ctx.fillText('Logic Signal Path (Stages 0-40)', padding, 70);}inputs.forEach(id=>document.getElementById(id).addEventListener('input', update));update();</script></body></html>
