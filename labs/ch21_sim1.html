<!DOCTYPE html><html><head><style>body{font-family:sans-serif;background:#1a1a1a;color:#eee;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:#000;border:1px solid #444;margin-top:20px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:600px;background:#333;padding:20px;border-radius:8px}.slider-group{display:flex;flex-direction:column}label{font-size:0.8em;margin-bottom:5px;color:#aaa}span{font-weight:bold;color:#fff}.header{text-align:center;margin-bottom:20px}h2{margin:0;color:#00d1ff}.metric-box{display:flex;gap:20px;margin-top:10px;font-family:monospace}</style></head><body><div class="header"><h2>Bimaterial Interface Simulator</h2><p>Visualizing Stress Singularities vs. Functional Gradients</p></div><div class="controls"><div class="slider-group"><label>Modulus Ratio (Rigid/Soft): <span id="e_ratio_val">50</span></label><input type="range" id="e_ratio" min="2" max="100" value="50"></div><div class="slider-group"><label>Gradient Width (%): <span id="width_val">10</span></label><input type="range" id="width" min="0" max="80" value="10"></div><div class="slider-group"><label>Penalization (p): <span id="p_val">1.0</span></label><input type="range" id="p" min="0.1" max="5.0" step="0.1" value="1.0"></div><button id="reset" style="height:40px;margin-top:15px">Reset Simulation</button></div><div class="metric-box"><div>Peak Stress Rise: <span id="peak_stress">0</span></div><div>Singularity Index: <span id="singularity">0</span></div></div><canvas id="simCanvas" width="600" height="300"></canvas><script>const canvas=document.getElementById('simCanvas');const ctx=canvas.getContext('2d');const eSlider=document.getElementById('e_ratio');const wSlider=document.getElementById('width');const pSlider=document.getElementById('p');function draw(){const E_rigid=parseFloat(eSlider.value);const width=parseFloat(wSlider.value)/100;const p=parseFloat(pSlider.value);document.getElementById('e_ratio_val').innerText=E_rigid;document.getElementById('width_val').innerText=Math.round(width*100);document.getElementById('p_val').innerText=p.toFixed(1);ctx.clearRect(0,0,600,300);const voxels=200;const w_px=600/voxels;let maxStress=0;let lastStress=0;let maxDelta=0;for(let i=0;i<voxels;i++){const x=i/voxels;let rho=0;const start=0.5-width/2;const end=0.5+width/2;if(x<start)rho=0;else if(x>end)rho=1;else rho=(x-start)/width;const E=1+(Math.pow(rho,p)*(E_rigid-1));const stress=E*2;if(stress>maxStress)maxStress=stress;if(i>0){const delta=Math.abs(stress-lastStress);if(delta>maxDelta)maxDelta=delta;}lastStress=stress;const r=Math.floor(rho*255);const b=Math.floor((1-rho)*255);ctx.fillStyle=`rgb(${r},100,${b})`;ctx.fillRect(i*w_px,300-stress*2,w_px,stress*2);ctx.strokeStyle='#fff';ctx.lineWidth=0.5;if(i%20==0){ctx.beginPath();ctx.moveTo(i*w_px,0);ctx.lineTo(i*w_px,300);ctx.stroke();}}document.getElementById('peak_stress').innerText=maxStress.toFixed(1);document.getElementById('singularity').innerText=maxDelta.toFixed(1);ctx.fillStyle='#00d1ff';ctx.font='12px Arial';ctx.fillText('Stress Profile \u03C3(x)',10,20);requestAnimationFrame(draw)}eSlider.oninput=wSlider.oninput=pSlider.oninput=draw;document.getElementById('reset').onclick=()=>{eSlider.value=50;wSlider.value=10;pSlider.value=1.0;draw()};draw();</script></body></html>
