<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px;}canvas{background:#222;border:1px solid #444;border-radius:4px;margin-bottom:20px;}.controls{display:grid;grid-template-columns:150px 250px 50px;gap:10px;background:#333;padding:20px;border-radius:8px;}.label{font-size:0.9em;color:#aaa;}#metrics{margin-top:20px;font-family:monospace;color:#0f0;}</style></head><body><h2>Ch 29: Tidal Annealing Landscape</h2><canvas id="simCanvas" width="600" height="400"></canvas><div class="controls"><span class="label">Tidal Pressure (σ)</span><input type="range" id="sigmaRange" min="0" max="10" step="0.1" value="0"><span id="sigmaVal">0.0</span><span class="label">Coupling (γ)</span><input type="range" id="gammaRange" min="0" max="2" step="0.1" value="0.5"><span id="gammaVal">0.5</span><span class="label">Asymmetry (β)</span><input type="range" id="asymRange" min="-1" max="1" step="0.05" value="0"><span id="asymVal">0.0</span></div><div id="metrics">Status: System Stable</div><script>const canvas=document.getElementById('simCanvas');const ctx=canvas.getContext('2d');const sR=document.getElementById('sigmaRange');const gR=document.getElementById('gammaRange');const aR=document.getElementById('asymRange');function draw(){const sigma=parseFloat(sR.value);const gamma=parseFloat(gR.value);const beta=parseFloat(aR.value);document.getElementById('sigmaVal').innerText=sigma;document.getElementById('gammaVal').innerText=gamma;document.getElementById('asymVal').innerText=beta;ctx.clearRect(0,0,600,400);ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(0,350);ctx.lineTo(600,350);ctx.stroke();ctx.strokeStyle='#0af';ctx.lineWidth=3;ctx.beginPath();let first=true;let minVal=Infinity;let minX=0;for(let x=-2;x<=2;x+=0.01){const V = 1.0*Math.pow(x,4) + (gamma*sigma - 2.0)*Math.pow(x,2) + beta*x;const px = 300 + x*140;const py = 300 - V*40;if(first){ctx.moveTo(px,py);first=false;}else{ctx.lineTo(px,py);}if(py>minVal){minVal=py;minX=px;}}ctx.stroke();ctx.fillStyle='red';ctx.beginPath();ctx.arc(minX,minVal-5,5,0,Math.PI*2);ctx.fill();const isBistable=(gamma*sigma - 2.0)<0;document.getElementById('metrics').innerText=`Logic State: ${isBistable?'[BISTABLE BIT]':'[ANNEALED RESET]'}`;requestAnimationFrame(draw);}draw();</script></body></html>
