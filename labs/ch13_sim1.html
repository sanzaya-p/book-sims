<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px;}canvas{background:#222;border:2px solid #444;border-radius:8px;}#ui{width:600px;margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;}.slider-group{display:flex;flex-direction:column;}.val{font-family:monospace;color:#0af;}</style></head><body><h2>Ch 13: XOR Destructive Interference</h2><canvas id="cvs" width="600" height="300"></canvas><div id="ui"><div class="slider-group"><label>Input A Displacement: <span id="vA" class="val">5</span>mm</label><input type="range" id="inA" min="-10" max="10" value="5" step="0.1"></div><div class="slider-group"><label>Input B Displacement: <span id="vB" class="val">0</span>mm</label><input type="range" id="inB" min="-10" max="10" value="0" step="0.1"></div><div class="slider-group"><label>Parasitic Stiffness ($K_p$): <span id="vKp" class="val">10</span></label><input type="range" id="inKp" min="0" max="100" value="10"></div><div class="slider-group"><label>Threshold: <span id="vT" class="val">2.0</span>mm</label><input type="range" id="inT" min="0.5" max="5" value="2.0" step="0.1"></div></div><div id="metrics" style="margin-top:20px;font-size:1.2em;">Output: <span id="outDisp" style="color:#0af">0.00</span> mm | Logic: <span id="outLogic" style="font-weight:bold;">0</span></div><script>const canvas=document.getElementById('cvs'),ctx=canvas.getContext('2d');const sliders={A:document.getElementById('inA'),B:document.getElementById('inB'),Kp:document.getElementById('inKp'),T:document.getElementById('inT')};function draw(){const a=parseFloat(sliders.A.value),b=parseFloat(sliders.B.value),kp=parseFloat(sliders.Kp.value),th=parseFloat(sliders.T.value);document.getElementById('vA').innerText=a;document.getElementById('vB').innerText=b;document.getElementById('vKp').innerText=kp;document.getElementById('vT').innerText=th;const c_i=0.5,k_j=100,loss=0.1;let outVal=(a*c_i+b*c_i)-(kp/k_j)*loss;if(Math.abs(outVal)<0.05)outVal=0;const logic=Math.abs(outVal)>=th?1:0;document.getElementById('outDisp').innerText=outVal.toFixed(2);document.getElementById('outLogic').innerText=logic;document.getElementById('outLogic').style.color=logic?'#0f0':'#f44';ctx.clearRect(0,0,600,300);ctx.strokeStyle='#444';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(100,100);ctx.lineTo(300,150);ctx.moveTo(100,200);ctx.lineTo(300,150);ctx.lineTo(500,150);ctx.stroke();ctx.fillStyle='#555';[100,100,300,500].forEach((x,i)=>{const y=i===0?100:i===1?200:150;ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();});ctx.lineWidth=8;ctx.strokeStyle='#0af';ctx.beginPath();ctx.moveTo(100,100);ctx.lineTo(100+a*5,100);ctx.stroke();ctx.strokeStyle='#0af';ctx.beginPath();ctx.moveTo(100,200);ctx.lineTo(100+b*5,200);ctx.stroke();ctx.strokeStyle=logic?'#0f0':'#f44';ctx.beginPath();ctx.moveTo(300,150);ctx.lineTo(300+outVal*10,150);ctx.stroke();ctx.fillStyle='#eee';ctx.fillText("Input A",70,90);ctx.fillText("Input B",70,190);ctx.fillText("Output Junction",260,140);requestAnimationFrame(draw);}draw();</script></body></html>
