<!DOCTYPE html><html><head><title>Threshold-Drift Map</title><style>body{background:#f8f9fa;color:#333;font-family:system-ui;padding:40px;display:flex;flex-direction:column;align-items:center}canvas{background:#fff;border:2px solid #dee2e6;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.05)}.ui{display:grid;grid-template-columns:1fr 1fr;gap:30px;width:700px;margin-top:30px}.slider-box{background:#fff;padding:15px;border-radius:8px;border:1px solid #dee2e6}h2{color:#2c3e50;margin-bottom:10px}label{font-weight:bold;display:block;margin-bottom:10px;font-size:14px}.val{float:right;color:#e67e22}.legend{display:flex;gap:20px;margin-bottom:10px}.legend-item{display:flex;align-items:center;font-size:12px}.color-box{width:12px;height:12px;margin-right:5px;border-radius:2px}</style></head><body><h2>Threshold-Drift Map: Autonomous Lifespan</h2><div class="legend"><div class="legend-item"><div class="color-box" style="background:rgba(46,204,113,0.2)"></div>Safe Logic Zone</div><div class="legend-item"><div class="color-box" style="background:#e74c3c"></div>P_logic(t)</div></div><canvas id="chart" width="700" height="350"></canvas><div class="ui"><div class="slider-box"><label>Fouling Rate (k_foul)<span class="val" id="kf_v">0.02</span></label><input type="range" id="kf" min="0" max="0.2" step="0.005" value="0.02" style="width:100%"></div><div class="slider-box"><label>Fatigue Rate (k_fat)<span class="val" id="kt_v">1.5</span></label><input type="range" id="kt" min="0" max="10" step="0.1" value="1.5" style="width:100%"></div></div><script>const canvas=document.getElementById('chart'),ctx=canvas.getContext('2d');function update(){const kf=parseFloat(document.getElementById('kf').value),kt=parseFloat(document.getElementById('kt').value);document.getElementById('kf_v').innerText=kf;document.getElementById('kt_v').innerText=kt;ctx.clearRect(0,0,700,350);ctx.fillStyle='rgba(46,204,113,0.1)';ctx.fillRect(50,50,600,100);ctx.strokeStyle='#dee2e6';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(50,150);ctx.lineTo(650,150);ctx.stroke();ctx.moveTo(50,50);ctx.lineTo(650,50);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(50,300);ctx.lineTo(650,300);ctx.lineTo(650,20);ctx.moveTo(50,300);ctx.lineTo(50,20);ctx.stroke();ctx.fillStyle='#95a5a6';ctx.font='12px Arial';ctx.fillText('0 yrs',45,315);ctx.fillText('5 yrs',635,315);ctx.fillText('100 mmHg',5,305);ctx.fillText('200 mmHg',5,25);ctx.strokeStyle='#e74c3c';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=100;i++){const t=i/20;const foul=60*(1-Math.exp(-kf*t*12));const fatigue=kt*5*Math.log10(t*40e6+1)/10;const p=140+foul-fatigue;const px=50+(i/100)*600;const py=300-((p-100)*2);if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.stroke();requestAnimationFrame(update)}update();</script></body></html>
