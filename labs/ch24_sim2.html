<!DOCTYPE html><html><head><title>Hill's Anisotropic Yield Simulation</title><style>body{background:#1a1a1a;color:#eee;font-family:Segoe UI,Tahoma,sans-serif;margin:0;display:flex;flex-direction:row;height:100vh;overflow:hidden;}#controls{width:350px;background:#252525;padding:20px;box-shadow:2px 0 10px rgba(0,0,0,0.5);z-index:10;display:flex;flex-direction:column;gap:15px;}#viewport{flex-grow:1;position:relative;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle, #333 0%, #111 100%);}.slider-box{background:#333;padding:12px;border-radius:8px;}.slider-box label{display:block;margin-bottom:8px;font-size:0.9em;color:#bbb;}input[type=range]{width:100%;cursor:pointer;}canvas{background:transparent;max-width:90%;max-height:90%;}.stat-row{display:flex;justify-content:space-between;margin-top:5px;font-weight:bold;}.warning{color:#ff4d4d;text-transform:uppercase;font-size:0.8em;margin-top:5px;display:none;}#gauge-container{width:100%;height:20px;background:#444;border-radius:10px;margin-top:10px;overflow:hidden;position:relative;}#gauge-bar{height:100%;width:0%;transition:width 0.1s, background 0.2s;}#guard-mark{position:absolute;left:40%;top:0;bottom:0;width:2px;background:#fff;opacity:0.6;}</style></head><body><div id="controls"><h2>Anisotropic Audit</h2><div class="slider-box"><label>Print Angle (θ): <span id="degVal">0</span>°</label><input type="range" id="angle" min="0" max="90" step="1" value="0"></div><div class="slider-box"><label>Z-Axis Strength (MPa): <span id="zVal">20</span></label><input type="range" id="zStrength" min="5" max="50" step="1" value="20"></div><div class="slider-box"><label>Applied Global Stress (MPa): <span id="sVal">15</span></label><input type="range" id="stress" min="1" max="50" step="1" value="15"></div><hr style="border:0;border-top:1px solid #444;"><div class="stat-row"><span>Hill Eq. Ratio:</span><span id="ratioVal">0.00</span></div><div id="gauge-container"><div id="gauge-bar"></div><div id="guard-mark"></div></div><div id="statusMsg" style="text-align:center;margin-top:15px;padding:10px;border-radius:5px;">SAFE</div><div style="font-size:0.75em;color:#888;margin-top:auto;">FDM Sim: X,Y strength fixed at 50MPa. White line marks 40% Guardband limit (Ratio=0.4).</div></div><div id="viewport"><canvas id="renderCanvas"></canvas></div><script>const canvas=document.getElementById('renderCanvas');const ctx=canvas.getContext('2d');const angleS=document.getElementById('angle');const zS=document.getElementById('zStrength');const sS=document.getElementById('stress');function resize(){canvas.width=600;canvas.height=600;}window.addEventListener('resize',resize);resize();function update(){const thetaDeg=parseFloat(angleS.value);const theta=thetaDeg*Math.PI/180;const Z=parseFloat(zS.value);const S_load=parseFloat(sS.value);const X=50;const Y=50;document.getElementById('degVal').innerText=thetaDeg;document.getElementById('zVal').innerText=Z;document.getElementById('sVal').innerText=S_load;const sigX=S_load*Math.pow(Math.cos(theta),2);const sigZ=S_load*Math.pow(Math.sin(theta),2);const tauZX=S_load*Math.sin(theta)*Math.cos(theta);const F=0.5*(1/(Y*Y)+1/(Z*Z)-1/(X*X));const G=0.5*(1/(Z*Z)+1/(X*X)-1/(Y*Y));const H=0.5*(1/(X*X)+1/(Y*Y)-1/(Z*Z));const M=0.5/Math.pow(Z*0.6,2);const hillSq=F*(-sigZ)**2+G*(sigZ-sigX)**2+H*(sigX)**2+2*M*(tauZX**2);const ratio=Math.sqrt(Math.max(0,hillSq));document.getElementById('ratioVal').innerText=ratio.toFixed(3);const bar=document.getElementById('gauge-bar');bar.style.width=Math.min(ratio*100,100)+'%';if(ratio>1.0){bar.style.background='#ff4d4d';statusMsg.innerText='CATASTROPHIC FAILURE';statusMsg.style.background='#611';}else if(ratio>0.4){bar.style.background='#ffaa00';statusMsg.innerText='GUARD VIOLATION';statusMsg.style.background='#641';}else{bar.style.background='#4dff4d';statusMsg.innerText='SAFE OPERATION';statusMsg.style.background='#141';}draw(theta,ratio);}function draw(theta,ratio){ctx.clearRect(0,0,canvas.width,canvas.height);const centerX=canvas.width/2;const centerY=canvas.height/2;const size=180;ctx.save();ctx.translate(centerX,centerY);ctx.rotate(theta);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(-size/2,-size/2,size,size);ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;for(let i=-size/2+10;i<size/2;i+=10){ctx.beginPath();ctx.moveTo(-size/2,i);ctx.lineTo(size/2,i);ctx.stroke();}ctx.restore();ctx.strokeStyle='#ff4d4d';ctx.lineWidth=4;const arrowLen=100+parseFloat(sS.value)*2;[-1,1].forEach(dir=>{ctx.beginPath();const x=centerX+dir*(size/2+30);ctx.moveTo(x,centerY-arrowLen/2);ctx.lineTo(x,centerY+arrowLen/2);ctx.stroke();ctx.beginPath();ctx.moveTo(x-10,centerY+(dir*arrowLen/2)-(dir*15));ctx.lineTo(x,centerY+(dir*arrowLen/2));ctx.lineTo(x+10,centerY+(dir*arrowLen/2)-(dir*15));ctx.stroke();});ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.textAlign='center';ctx.fillText('Applied Tensile Load',centerX,centerY-size/2-50);ctx.fillStyle='#aaa';ctx.fillText('Part Local Z (Build Dir)',centerX+Math.sin(theta)*120,centerY-Math.cos(theta)*120);}angleS.oninput=zS.oninput=sS.oninput=update;update();</script></body></html>
