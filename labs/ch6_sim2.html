<!DOCTYPE html><html><head><style>body{background:#000;color:#fff;font-family:monospace;display:flex;flex-direction:column;align-items:center;}canvas{background:#111;border:2px solid #333;}.ui{background:#222;padding:20px;border-radius:10px;width:500px;margin:20px;}.slider-row{margin:15px 0;display:flex;justify-content:space-between;}.label{color:#aaa;}.readout{color:#0af;font-weight:bold;}</style></head><body><h2>Acoustic Logic Limit Visualization</h2><div class="ui"><div class="slider-row"><span class="label">Gate Length (mm):</span><input type="range" id="Lg" min="1" max="20" value="10"><span class="readout" id="Lg_r">10</span></div><div class="slider-row"><span class="label">Path Depth (Gates):</span><input type="range" id="Nd" min="1" max="100" value="20"><span class="readout" id="Nd_r">20</span></div><div class="slider-row"><span class="label">Material Stiffness (E - GPa):</span><input type="range" id="stiff" min="50" max="1200" value="380"><span class="readout" id="stiff_r">380</span></div><div class="slider-row"><span class="label">Material Density (kg/m3):</span><input type="range" id="dens" min="1000" max="5000" value="3950"><span class="readout" id="dens_r">3950</span></div></div><canvas id="waveCanvas" width="500" height="200"></canvas><h3 id="freqReadout">f_max: --- Hz</h3><script>const canvas=document.getElementById('waveCanvas');const ctx=canvas.getContext('2d');let phase=0;function updateSim(){const Lg=parseFloat(document.getElementById('Lg').value)/1000;const Nd=parseFloat(document.getElementById('Nd').value);const E=parseFloat(document.getElementById('stiff').value)*1e9;const rho=parseFloat(document.getElementById('dens').value);document.getElementById('Lg_r').innerText=document.getElementById('Lg').value;document.getElementById('Nd_r').innerText=Nd;document.getElementById('stiff_r').innerText=document.getElementById('stiff').value;document.getElementById('dens_r').innerText=rho;const c_sound=Math.sqrt(E/rho);const f_max=c_sound/(Lg*Nd);document.getElementById('freqReadout').innerText=`Theoretical Max Clock: ${f_max.toFixed(2)} Hz`;ctx.clearRect(0,0,500,200);ctx.strokeStyle='#0af';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<500;x++){const waveX=(x/500)*Nd*Lg;const y=100+40*Math.sin(2*Math.PI*f_max*(waveX/c_sound)-phase);if(x==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();ctx.fillStyle='#333';for(let i=0;i<Nd;i++){ctx.fillRect((i/Nd)*500,180,2,20);}phase+=0.2;requestAnimationFrame(updateSim);}updateSim();</script></body></html>
