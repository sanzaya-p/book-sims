<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center}canvas{background:#222;border:1px solid #444;margin:20px}#controls{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:600px;background:#333;padding:20px;border-radius:8px}.slider-container{display:flex;flex-direction:column}label{font-size:12px;margin-bottom:5px;color:#aaa}span{font-weight:bold;color:#0f0}</style></head><body><h2>Harvard Soft Ring Oscillator</h2><div id="controls"><div class="slider-container"><label>Channel Diameter (mm): <span id="dVal">1.2</span></label><input type="range" id="dInput" min="0.5" max="2.5" step="0.1" value="1.2"></div><div class="slider-container"><label>Channel Length (cm): <span id="lVal">5.0</span></label><input type="range" id="lInput" min="1" max="10" step="0.5" value="5.0"></div><div class="slider-container"><label>Compliance (nL/Pa): <span id="cVal">0.2</span></label><input type="range" id="cInput" min="0.05" max="1" step="0.05" value="0.2"></div><div class="slider-container"><label>Number of Gates (Odd): <span id="nVal">3</span></label><input type="range" id="nInput" min="3" max="9" step="2" value="3"></div></div><canvas id="simCanvas" width="600" height="300"></canvas><script>const canvas=document.getElementById('simCanvas');const ctx=canvas.getContext('2d');let P=[];let time=0;function updateParams(){const D=parseFloat(document.getElementById('dInput').value)*0.001;const L=parseFloat(document.getElementById('lInput').value)*0.01;const C=parseFloat(document.getElementById('cInput').value)*1e-9;const mu=1.8e-5;const R=(128*mu*L)/(Math.PI*Math.pow(D,4));return R*C;}function transfer(pIn){return 1000/(1+Math.exp(0.01*(pIn-500)));}function init(){const n=parseInt(document.getElementById('nInput').value);P=new Array(n).fill(0);P[0]=800;}function draw(){const n=parseInt(document.getElementById('nInput').value);const tau=updateParams();if(P.length!==n)init();const dt=0.005;for(let step=0;step<10;step++){let nextP=[...P];for(let i=0;i<n;i++){let pPrev=P[(i-1+n)%n];let pTarget=transfer(pPrev);nextP[i]+=dt*(pTarget-P[i])/tau;}P=nextP;}ctx.clearRect(0,0,600,300);ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(0,150);ctx.lineTo(600,150);ctx.stroke();P.forEach((p,i)=>{ctx.fillStyle=`hsl(${i*360/n}, 70%, 50%)`;const x=(i+1)*600/(n+1);const y=300-p/1000*250-25;ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();ctx.fillText('G'+i,x-10,y-20);});document.getElementById('dVal').innerText=document.getElementById('dInput').value;document.getElementById('lVal').innerText=document.getElementById('lInput').value;document.getElementById('cVal').innerText=document.getElementById('cInput').value;document.getElementById('nVal').innerText=document.getElementById('nInput').value;requestAnimationFrame(draw);}init();draw();</script></body></html>
