<!DOCTYPE html><html><head><style>body{background:#000;color:#0f0;font-family:monospace;padding:20px;display:flex;flex-direction:column;align-items:center;}canvas{border:1px solid #0f0;margin-bottom:20px;}.panel{background:#111;padding:15px;border:1px solid #0f0;width:550px;}.row{display:flex;justify-content:space-between;margin:5px 0;}input{width:200px;}#d_val{color:#f00;font-weight:bold;}</style></head><body><h2>SIM: State-Space Divergence D(t)</h2><canvas id="cvs" width="600" height="300"></canvas><div class="panel"><div class="row"><span>Sampling Rate (Hz)</span><input type="range" id="fs" min="2" max="100" value="20"><span id="fs_v">20</span></div><div class="row"><span>Proc. Latency (ms)</span><input type="range" id="tp" min="0" max="200" value="50"><span id="tp_v">50</span></div><div class="row"><span>Mech. Frequency (Hz)</span><input type="range" id="fm" min="1" max="10" value="2"><span id="fm_v">2</span></div><div class="row"><span>Current Divergence:</span><span id="d_val">0.00</span></div></div><script>const canvas=document.getElementById('cvs');const ctx=canvas.getContext('2d');const fsI=document.getElementById('fs');const tpI=document.getElementById('tp');const fmI=document.getElementById('fm');let tick=0;function draw(){tick+=0.02;const fs=parseFloat(fsI.value);const tp=parseFloat(tpI.value)/1000;const fm=parseFloat(fmI.value);document.getElementById('fs_v').innerText=fs;document.getElementById('tp_v').innerText=(tp*1000).toFixed(0);document.getElementById('fm_v').innerText=fm;ctx.fillStyle='#000';ctx.fillRect(0,0,600,300);ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(0,150);ctx.lineTo(600,150);ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.beginPath();for(let x=0;x<600;x++){const t=tick+(x/100);const y=150+Math.sin(2*Math.PI*fm*t)*100;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();ctx.strokeStyle='#f0f';ctx.beginPath();let totalD=0;for(let x=0;x<600;x++){const t=tick+(x/100);const t_delayed=t-tp;const t_sampled=Math.floor(t_delayed*fs)/fs;const y_phys=150+Math.sin(2*Math.PI*fm*t)*100;const y_dig=150+Math.sin(2*Math.PI*fm*t_sampled)*100;totalD+=Math.abs(y_phys-y_dig);if(x===0)ctx.moveTo(x,y_dig);else ctx.lineTo(x,y_dig);}ctx.stroke();document.getElementById('d_val').innerText=(totalD/600).toFixed(2);requestAnimationFrame(draw);}draw();</script></body></html>
