<!DOCTYPE html><html><head><title>Bistable Logic Snap</title><style>body{background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:#222;border:1px solid #444;border-radius:4px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px;width:600px}.slider-group{display:flex;flex-direction:column}label{font-size:12px;color:#aaa;margin-bottom:5px}span{font-family:monospace;color:#0af}.metrics{background:#222;padding:15px;border-radius:8px;width:600px;border-left:4px solid #0af}h3{margin-top:0}</style></head><body><h3>Ch26: The Binary Snap & Diffusion Lag</h3><div class="metrics"><div id="m_tau">Diffusion Time (&tau;): 0s</div><div id="m_state">Gate State: Bistable</div><div id="m_bias">Chemical Bias Force: 0.00</div></div><canvas id="plot" width="600" height="300"></canvas><div class="controls"><div class="slider-group"><label>Stiffness (a): <span id="v_a">-5.0</span></label><input type="range" id="a" min="-10" max="-1" step="0.1" value="-5"></div><div class="slider-group"><label>Non-linearity (b): <span id="v_b">2.0</span></label><input type="range" id="b" min="0.5" max="5" step="0.1" value="2"></div><div class="slider-group"><label>Gel Thickness (L): <span id="v_L">0.5</span></label><input type="range" id="L" min="0.1" max="1.0" step="0.05" value="0.5"></div><div class="slider-group"><label>External Signal (Glucose): <span id="v_sig">0.0</span></label><input type="range" id="sig" min="0" max="20" step="0.1" value="0"></div></div><button onclick="reset()">Reset Gate</button><script>const canvas=document.getElementById('plot'),ctx=canvas.getContext('2d');let a_val=-5,b_val=2,L_val=0.5,sig_val=0,current_bias=0;function reset(){document.getElementById('sig').value=0;sig_val=0;current_bias=0}function draw(){a_val=parseFloat(document.getElementById('a').value);b_val=parseFloat(document.getElementById('b').value);L_val=parseFloat(document.getElementById('L').value);sig_val=parseFloat(document.getElementById('sig').value);document.getElementById('v_a').innerText=a_val.toFixed(1);document.getElementById('v_b').innerText=b_val.toFixed(1);document.getElementById('v_L').innerText=L_val.toFixed(2);document.getElementById('v_sig').innerText=sig_val.toFixed(1);const D=0.005,tau=Math.pow(L_val,2)/D;current_bias+=(sig_val-current_bias)*0.05;document.getElementById('m_tau').innerText='Diffusion Time (tau): '+tau.toFixed(2)+'s';document.getElementById('m_bias').innerText='Chemical Bias Force: '+current_bias.toFixed(2);ctx.clearRect(0,0,600,300);ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(0,250);ctx.lineTo(600,250);ctx.stroke();ctx.strokeStyle='#0af';ctx.lineWidth=2;ctx.beginPath();let minV=Infinity,snapX=0;for(let i=0;i<canvas.width;i++){let x=(i-300)/100;let v=a_val*x*x+b_val*Math.pow(x,4)-current_bias*x;let py=200-(v*10);if(i===0)ctx.moveTo(i,py);else ctx.lineTo(i,py);if(v<minV){minV=v;snapX=i}}ctx.stroke();ctx.fillStyle='#f0f';ctx.beginPath();ctx.arc(snapX,200-(minV*10),6,0,Math.PI*2);ctx.fill();requestAnimationFrame(draw)}draw();</script></body></html>
