<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px;}canvas{background:#222;border:1px solid #444;margin:20px;}.controls{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:600px;}.slider-group{display:flex;flex-direction:column;}label{font-size:0.8em;color:#aaa;}#metrics{width:600px;display:flex;justify-content:space-between;background:#333;padding:10px;border-radius:4px;}</style></head><body><h2>Ch14: Mechanical Signal Regeneration</h2><div class="controls"><div class="slider-group"><label>Attenuation (α)</label><input type="range" id="alpha" min="0" max="0.5" step="0.01" value="0.1"><span id="alphaVal">0.1</span></div><div class="slider-group"><label>Repeater Gain (Gm)</label><input type="range" id="gain" min="0.5" max="2.0" step="0.1" value="1.0"><span id="gainVal">1.0</span></div><div class="slider-group"><label>Regeneration Mode</label><select id="mode"><option value="passive">Passive Bus</option><option value="active">Active Repeaters</option></select></div><div class="slider-group"><label>Input Pulse</label><button onclick="resetSim()">Trigger Signal</button></div></div><canvas id="simCanvas" width="600" height="300"></canvas><div id="metrics"><span>Horizon: <b id="h_metric">-</b></span><span>Reset Energy: <b id="e_metric">0</b></span><span>Terminal SNR: <b id="s_metric">0</b></span></div><script>const canvas=document.getElementById('simCanvas');const ctx=canvas.getContext('2d');let alpha=0.1,gain=1.0,mode='passive';function draw(){ctx.clearRect(0,0,600,300);const nodes=40;const dx=600/nodes;let signal=1.0;let totalE=0;let horizon=nodes;ctx.strokeStyle='#0f0';ctx.beginPath();ctx.moveTo(0,150-signal*100);for(let i=0;i<nodes;i++){let x=i*dx;let y=150-signal*100;ctx.lineTo(x,y);if(mode==='active'){totalE+=gain*0.5;if(signal>0.3)signal=1.0*gain;else signal=0;}signal*=Math.exp(-alpha);if(signal<0.1 && horizon===nodes)horizon=i;}ctx.stroke();ctx.fillStyle='#444';for(let i=0;i<nodes;i++)ctx.fillRect(i*dx-2,148,4,4);document.getElementById('h_metric').innerText=horizon;document.getElementById('e_metric').innerText=mode==='active'?totalE.toFixed(1):'0';document.getElementById('s_metric').innerText=signal.toFixed(2);requestAnimationFrame(draw);}document.getElementById('alpha').oninput=e=>{alpha=parseFloat(e.target.value);document.getElementById('alphaVal').innerText=alpha;};document.getElementById('gain').oninput=e=>{gain=parseFloat(e.target.value);document.getElementById('gainVal').innerText=gain;};document.getElementById('mode').onchange=e=>{mode=e.target.value;};function resetSim(){alpha=0.1;gain=1.0;document.getElementById('alpha').value=0.1;document.getElementById('gain').value=1.0;}draw();</script></body></html>
