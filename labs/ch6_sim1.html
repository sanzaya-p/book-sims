<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px;}canvas{background:#222;border:1px solid #444;margin:20px;}.controls{display:grid;grid-template-columns:1fr 200px 60px;gap:15px;width:600px;background:#333;padding:20px;border-radius:8px;}label{font-size:0.9em;}.value-box{background:#000;padding:2px 5px;border-radius:4px;color:#0f0;text-align:right;font-family:monospace;}.metric{margin-top:20px;font-size:1.2em;font-weight:bold;}</style></head><body><h2>Ch6: Shielding-Mass Runaway vs. TID Drift</h2><div class="controls"><label>Flux (Gy/hr):</label><input type="range" id="flux" min="1" max="200" value="50"><div class="value-box" id="fluxVal">50</div><label>Lead Shielding (cm):</label><input type="range" id="shield" min="0" max="10" step="0.1" value="2"><div class="value-box" id="shieldVal">2.0</div><label>Mission Time (Days):</label><input type="range" id="time" min="1" max="365" value="30"><div class="value-box" id="timeVal">30</div></div><canvas id="simCanvas" width="600" height="300"></canvas><div id="status" class="metric">Status: Operational</div><script>const canvas=document.getElementById('simCanvas');const ctx=canvas.getContext('2d');function update(){const flux=parseFloat(document.getElementById('flux').value);const shield=parseFloat(document.getElementById('shield').value);const days=parseFloat(document.getElementById('time').value);document.getElementById('fluxVal').innerText=flux;document.getElementById('shieldVal').innerText=shield.toFixed(1);document.getElementById('timeVal').innerText=days;const attenFlux=flux*Math.exp(-0.5*shield);const totalDose=attenFlux*(days*24);const vThShift=-(1.6e-19/3.45e-11)*(totalDose*1e11*0.5*10e-9)*1e6;ctx.clearRect(0,0,600,300);ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(50,250);ctx.lineTo(550,250);ctx.stroke();ctx.beginPath();ctx.moveTo(50,50);ctx.lineTo(50,250);ctx.stroke();ctx.fillStyle='#555';ctx.fillRect(50,250,500,-(0.5*200));ctx.fillStyle='#f00';ctx.fillText("Failure Limit (-0.5V)",60,145);ctx.strokeStyle='#0f0';ctx.beginPath();ctx.moveTo(50,250);for(let i=0;i<=100;i++){const t=i*days/100;const d=attenFlux*(t*24);const v=-(1.6e-19/3.45e-11)*(d*1e11*0.5*10e-9)*1e6;ctx.lineTo(50+i*5,250+(v*200));}ctx.stroke();const status=document.getElementById('status');if(vThShift<-0.5){status.innerText="STATUS: SYSTEM FAILURE (Drift > 0.5V)";status.style.color="#f55";}else{status.innerText="STATUS: OPERATIONAL";status.style.color="#5f5";}}document.querySelectorAll('input').forEach(i=>i.addEventListener('input',update));update();</script></body></html>
