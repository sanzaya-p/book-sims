<!DOCTYPE html><html><head><style>body{font-family:sans-serif;background:#121212;color:#eee;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:#1e1e1e;border:1px solid #444;margin:20px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:600px;background:#252525;padding:20px;border-radius:8px}.slider-group{display:flex;flex-direction:column}label{font-size:0.8em;color:#aaa;margin-bottom:5px}input{width:100%}.metrics{margin-top:20px;font-family:monospace;font-size:1.2em;color:#0f0}</style></head><body><h2>Goodman-Basquin Fatigue Envelope</h2><div class="controls"><div class="slider-group"><label>Mean Stress (σm): <span id="val-sm">0</span> MPa</label><input type="range" id="sm" min="0" max="1200" value="200"></div><div class="slider-group"><label>Stress Amp (σa): <span id="val-sa">400</span> MPa</label><input type="range" id="sa" min="10" max="1000" value="400"></div><div class="slider-group"><label>Exponent (b): <span id="val-b">-0.08</span></label><input type="range" id="b" min="-0.2" max="-0.02" step="0.005" value="-0.08"></div><div class="slider-group"><button onclick="reset()">Reset Regime</button></div></div><canvas id="plot" width="600" height="400"></canvas><div class="metrics" id="output">Life: -- cycles</div><script>const canvas=document.getElementById('plot'),ctx=canvas.getContext('2d');const inputs=['sm','sa','b'];const UTS=1300, Sf=1500;function reset(){document.getElementById('sm').value=200;document.getElementById('sa').value=400;document.getElementById('b').value=-0.08;update();}function update(){inputs.forEach(id=>{document.getElementById('val-'+id).innerText=document.getElementById(id).value;});const sm=parseFloat(document.getElementById('sm').value);const sa=parseFloat(document.getElementById('sa').value);const b=parseFloat(document.getElementById('b').value);const goodmanFactor=1-(sm/UTS);let life=0;if(goodmanFactor>0){const revs=Math.pow(sa/(Sf*goodmanFactor),1/b);life=revs/2;}document.getElementById('output').innerText=life>1e9?"Life: >10^9 (Endurance)":"Life: "+life.toExponential(2)+" cycles";draw(sm,sa,b);}function draw(sm,sa,b){ctx.clearRect(0,0,600,400);ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(50,350);ctx.lineTo(550,350);ctx.moveTo(50,350);ctx.lineTo(50,50);ctx.stroke();ctx.strokeStyle='#08f';ctx.beginPath();ctx.moveTo(50,350- (Sf/5));for(let x=0;x<=500;x++){const cycles=Math.pow(10,x/100);const s_limit=Sf*Math.pow(2*cycles,b);ctx.lineTo(50+x,350- (s_limit/5));}ctx.stroke();ctx.fillStyle='#aaa';ctx.fillText("Log10(Cycles)",500,370);ctx.fillText("Stress Amp (MPa)",10,40);ctx.fillStyle='#f00';const curX=Math.log10(Math.max(1,Math.pow(sa/(Sf*(1-sm/UTS)),1/b)/2))*100;if(!isNaN(curX)&&curX<500){ctx.beginPath();ctx.arc(50+curX,350-(sa/5),5,0,Math.PI*2);ctx.fill();ctx.fillText("Target",50+curX+10,350-(sa/5));}}inputs.forEach(id=>document.getElementById(id).oninput=update);update();</script></body></html>
