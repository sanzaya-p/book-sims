<!DOCTYPE html><html><head><title>Curvature Divergence</title><style>body{font-family:sans-serif;background:#1a1a1a;color:#eee;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:#000;border:1px solid #444;box-shadow:0 0 15px rgba(0,255,0,0.1)}#ui{width:600px;margin-top:20px;padding:15px;background:#2a2a2a;border-radius:8px}.row{display:flex;justify-content:space-between;margin:10px 0}input{width:100%}.metric{font-family:monospace;color:#0f0;font-size:1.2em}</style></head><body><h2>Exact vs. Linear Curvature Visualization</h2><canvas id="cvs" width="600" height="300"></canvas><div id="ui"><div class="row"><span>Deflection Amplitude (A):</span><input type="range" id="amp" min="0.01" max="0.8" step="0.01" value="0.1"></div><div class="row"><span>Linear M = EI w'':</span><span id="lin-val" class="metric">0</span></div><div class="row"><span>Exact M = EI &kappa;:</span><span id="ext-val" class="metric">0</span></div><div class="row"><span>Geometry Error:</span><span id="err-val" style="color:#f55" class="metric">0%</span></div><button onclick="reset()" style="width:100%;padding:8px;cursor:pointer">Reset System</button></div><script>const canvas=document.getElementById('cvs');const ctx=canvas.getContext('2d');const ampIn=document.getElementById('amp');const linVal=document.getElementById('lin-val');const extVal=document.getElementById('ext-val');const errVal=document.getElementById('err-val');function reset(){ampIn.value=0.1;draw();}function draw(){const L=500;const A=parseFloat(ampIn.value)*100;ctx.clearRect(0,0,600,300);ctx.strokeStyle='#333';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(50,150);ctx.lineTo(550,150);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.strokeStyle='#0f0';ctx.lineWidth=3;for(let x=0;x<=L;x++){const relX=x/L;const w=A*Math.sin(Math.PI*relX);const screenX=50+x;const screenY=150+w;if(x===0)ctx.moveTo(screenX,screenY);else ctx.lineTo(screenX,screenY);}ctx.stroke();const midX=0.5;const slope=(A/100)*(Math.PI)*Math.cos(Math.PI*midX);const d2w=-(A/100)*Math.pow(Math.PI,2)*Math.sin(Math.PI*midX);const kLin=Math.abs(d2w);const kExt=Math.abs(d2w)/Math.pow(1+slope*slope,1.5);const err=((kLin-kExt)/kExt)*100;linVal.innerText=kLin.toFixed(3);extVal.innerText=kExt.toFixed(3);errVal.innerText=err.toFixed(1)+'%';requestAnimationFrame(draw);}ampIn.oninput=draw;draw();</script></body></html>
