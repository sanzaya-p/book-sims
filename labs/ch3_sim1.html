<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:#222;border:1px solid #444;border-radius:4px;margin:20px}.ctrl{display:grid;grid-template-columns:120px 200px 60px;gap:10px;margin-bottom:10px}input{width:200px}label{font-weight:bold;color:#aaa}</style></head><body><h2>Ch3: Double-Well Potential Dynamics</h2><div class='ctrl'><label>Stiffness (a):</label><input type='range' id='slA' min='0.1' max='2' step='0.1' value='0.5'><span id='vA'>0.5</span></div><div class='ctrl'><label>Bistability (b):</label><input type='range' id='slB' min='-2' max='5' step='0.1' value='2'><span id='vB'>2.0</span></div><div class='ctrl'><label>Input Force (F):</label><input type='range' id='slF' min='-5' max='5' step='0.1' value='0'><span id='vF'>0.0</span></div><button id='reset' style='padding:8px 20px;cursor:pointer'>Reset State</button><canvas id='simCanvas' width='600' height='400'></canvas><div id='metrics'></div><script>const canvas=document.getElementById('simCanvas');const ctx=canvas.getContext('2d');let xPos=1.0;let vel=0;const dt=0.05;const damping=0.8;function getU(x,a,b,f){return a*Math.pow(x,4)-b*Math.pow(x,2)-f*x}function getForce(x,a,b,f){return-(4*a*Math.pow(x,3)-2*b*x-f)}function update(){const a=parseFloat(document.getElementById('slA').value);const b=parseFloat(document.getElementById('slB').value);const f=parseFloat(document.getElementById('slF').value);document.getElementById('vA').textContent=a;document.getElementById('vB').textContent=b;document.getElementById('vF').textContent=f;const force=getForce(xPos,a,b,f);vel=vel*damping+force*dt;xPos+=vel*dt;ctx.clearRect(0,0,600,400);ctx.strokeStyle='#444';ctx.beginPath();ctx.moveTo(0,350);ctx.lineTo(600,350);ctx.stroke();ctx.strokeStyle='#0af';ctx.lineWidth=2;ctx.beginPath();for(let px=0;px<600;px++){const sx=(px-300)/100;const sy=getU(sx,a,b,f);ctx.lineTo(px,300+sy*20)}ctx.stroke();ctx.fillStyle='#f55';ctx.beginPath();ctx.arc(300+xPos*100,300+getU(xPos,a,b,f)*20-10,10,0,Math.PI*2);ctx.fill();const isBistable=b>0?'Bistable Regime (Switch)':'Monostable Regime (Structural)';document.getElementById('metrics').innerHTML=`Status: <b>${isBistable}</b> | Current State x: ${xPos.toFixed(3)}`;requestAnimationFrame(update)}document.getElementById('reset').onclick=()=>{xPos=0;vel=0};update();</script></body></html>
