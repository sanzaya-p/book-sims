<!DOCTYPE html><html><head><title>von Karman Snap-Through</title><style>body{background:#121212;color:#fff;font-family:'Segoe UI',sans-serif;text-align:center;margin:0;overflow:hidden}#container{display:flex;height:100vh}#sidebar{width:300px;background:#1e1e1e;padding:20px;border-right:1px solid #333;display:flex;flex-direction:column;gap:15px}canvas{flex-grow:1;background:#000}.slider-box{text-align:left}input{width:100%}.stat{color:#00e5ff;font-weight:bold}</style></head><body><div id="container"><div id="sidebar"><h2>Logic Bit Snap</h2><div class="slider-box"><label>Applied Force (q)</label><input type="range" id="force" min="-50" max="50" value="0"><span id="f-val">0</span></div><div class="slider-box"><label>Beam Stiffness (EI)</label><input type="range" id="stiff" min="1" max="20" value="10"></div><div class="slider-box"><label>Axial Constraint (EA)</label><input type="range" id="axial" min="1" max="50" value="25"></div><hr><div style="text-align:left"><div>Tension (N): <span id="n-stat" class="stat">0</span></div><div>State: <span id="state-stat" class="stat">"0"</span></div></div><p style="font-size:0.8em;color:#888">The von Karman term couples bending to axial tension. Increase force to trigger a 'Snap-through' to the opposite binary state.</p><button onclick="location.reload()">Reset Bit</button></div><canvas id="sim"></canvas></div><script>const canvas=document.getElementById('sim');const ctx=canvas.getContext('2d');const fIn=document.getElementById('force');const sIn=document.getElementById('stiff');const aIn=document.getElementById('axial');let w_amp=30;let w_current=30;let vel=0;function update(){const force=parseFloat(fIn.value);const stiffness=parseFloat(sIn.value)*0.5;const constraint=parseFloat(aIn.value)*0.1;const dx=1/50;const dw_dx=w_current*Math.PI;const N=constraint*0.5*(dw_dx*dw_dx);const bending_force=-stiffness*(w_current-30);const tension_force=-N*w_current*0.01;const total_accel=bending_force+tension_force+force;vel+=total_accel*0.1;vel*=0.95;w_current+=vel*0.1;document.getElementById('f-val').innerText=force;document.getElementById('n-stat').innerText=N.toFixed(2);document.getElementById('state-stat').innerText=w_current>0?"'0'":"'1'";}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const midY=canvas.height/2;const startX=100;const endX=canvas.width-100;const L=endX-startX;ctx.beginPath();ctx.strokeStyle='#333';ctx.moveTo(startX,midY);ctx.lineTo(endX,midY);ctx.stroke();ctx.beginPath();ctx.strokeStyle=Math.abs(w_current)<5?'#ff0055':'#00e5ff';ctx.lineWidth=4;ctx.moveTo(startX,midY);for(let i=0;i<=100;i++){const t=i/100;const x=startX+t*L;const y=midY+w_current*Math.sin(Math.PI*t);ctx.lineTo(x,y);}ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(startX,midY,8,0,7);ctx.arc(endX,midY,8,0,7);ctx.fill();}function loop(){update();draw();requestAnimationFrame(loop);}window.onresize=()=>{canvas.width=window.innerWidth-300;canvas.height=window.innerHeight;};window.onresize();loop();</script></body></html>
