<!DOCTYPE html><html><head><title>Bistable Snap Simulator</title><style>body{background:#111;color:#eee;font-family:sans-serif;margin:0;display:flex;flex-direction:column;align-items:center}canvas{background:#222;border:1px solid #444;margin:20px}#ui{display:grid;grid-template-columns:150px 200px 50px;gap:10px;background:#333;padding:15px;border-radius:8px}.label{text-align:right;padding-right:10px}.val{font-weight:bold;color:#0af}</style></head><body><h2>The Maxwell Threshold & Snap-Through</h2><div id="ui"><div class="label">Stiffness (a):</div><input type="range" id="a" min="0.5" max="5" step="0.1" value="1"><div class="val" id="a_v">1.0</div><div class="label">Bistability (b):</div><input type="range" id="b" min="0.5" max="5" step="0.1" value="2"><div class="val" id="b_v">2.0</div><div class="label">Damping:</div><input type="range" id="d" min="0.01" max="1" step="0.01" value="0.1"><div class="val" id="d_v">0.1</div><button id="reset" style="grid-column:1/4">Reset Simulation</button></div><canvas id="canvas" width="600" height="400"></canvas><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let a=1,b=2,d=0.1,x=-1.4,v=0,m=0.5;const resetBtn=document.getElementById('reset');function getU(xVal){return 0.25*a*Math.pow(xVal,4)-0.5*b*Math.pow(xVal,2)}function draw(){ctx.clearRect(0,0,600,400);ctx.strokeStyle='#555';ctx.beginPath();for(let i=0;i<600;i++){const lx=(i-300)/100;const ly=200+getU(lx)*50;if(i===0)ctx.moveTo(i,ly);else ctx.lineTo(i,ly)}ctx.stroke();let force=-a*Math.pow(x,3)+b*x;if(x<0)force+=0.2;v+=(force-d*v)/m*0.1;x+=v*0.1;const px=300+x*100,py=200+getU(x)*50;ctx.fillStyle='#f33';ctx.beginPath();ctx.arc(px,py,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eee';ctx.fillText(`Velocity: ${v.toFixed(2)}`,20,20);ctx.fillText(`Potential Energy: ${getU(x).toFixed(2)}`,20,40);requestAnimationFrame(draw)}resetBtn.onclick=()=>{x=-Math.sqrt(b/a);v=0};['a','b','d'].forEach(id=>{const el=document.getElementById(id);el.oninput=()=>{window[id]=parseFloat(el.value);document.getElementById(id+'_v').innerText=el.value;x=-Math.sqrt(b/a);v=0}});draw();</script></body></html>
