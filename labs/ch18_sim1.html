<!DOCTYPE html><html><head><style>
body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
.card { background: #1e1e1e; border-radius: 8px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 800px; }
canvas { background: #000; border: 1px solid #444; border-radius: 4px; width: 100%; height: 300px; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
.slider-group { display: flex; flex-direction: column; }
label { font-size: 0.9em; margin-bottom: 5px; color: #aaa; }
.stats { display: flex; justify-content: space-between; margin-top: 15px; font-family: monospace; color: #00ff00; }
button { background: #3d5afe; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; }
button:hover { background: #536dfe; }
</style></head><body>
<div class="card">
    <h3>Ch. 18: The State Overwrite Tax</h3>
    <p>Visualizing the collapse of the bistable logic well $V(q)$ due to repeated 'mechanical thoughts'.</p>
    <canvas id="simCanvas"></canvas>
    <div class="stats">
        <span>Cycles: <span id="val-cycles">0</span></span>
        <span>Barrier: <span id="val-barrier">0.00</span> J</span>
        <span>Stability: <span id="val-status">STABLE</span></span>
    </div>
    <div class="controls">
        <div class="slider-group">
            <label>Linear Stiffness (k): <span id="k-label">10.0</span></label>
            <input type="range" id="input-k" min="1" max="20" step="0.1" value="10">
        </div>
        <div class="slider-group">
            <label>Buckling Coeff (alpha): <span id="a-label">0.10</span></label>
            <input type="range" id="input-a" min="0.01" max="0.5" step="0.01" value="0.1">
        </div>
        <button onclick="resetSim()">Reset Lattice History</button>
        <button onclick="addCycle()">Process Logic Pulse (+20 Cycles)</button>
    </div>
</div>
<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
let cycles = 0;

function getV(q, k, alpha) {
    return 0.5 * k * Math.pow(q, 2) - alpha * Math.pow(q, 4);
}

function draw() {
    const k_init = parseFloat(document.getElementById('input-k').value);
    const a_init = parseFloat(document.getElementById('input-a').value);
    
    // Apply Fatigue
    const k = k_init * Math.pow(0.998, cycles);
    const alpha = a_init * Math.pow(1.001, cycles);
    
    document.getElementById('k-label').innerText = k.toFixed(2);
    document.getElementById('a-label').innerText = alpha.toFixed(3);
    document.getElementById('val-cycles').innerText = cycles;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Axes
    ctx.strokeStyle = '#333';
    ctx.beginPath();
    ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2);
    ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height);
    ctx.stroke();

    // Plot V(q)
    ctx.strokeStyle = '#00ff00';
    ctx.lineWidth = 2;
    ctx.beginPath();
    
    let maxV = -Infinity;
    for(let x = 0; x < canvas.width; x++) {
        let q = (x - canvas.width/2) / 40;
        let v = getV(q, k, alpha);
        let plotY = canvas.height/2 - (v * 10);
        if(x === 0) ctx.moveTo(x, plotY); else ctx.lineTo(x, plotY);
        
        // Find barrier height roughly
        if (q > 0 && q < 5) maxV = Math.max(maxV, v);
    }
    ctx.stroke();
    
    document.getElementById('val-barrier').innerText = maxV.toFixed(2);
    const statusEl = document.getElementById('val-status');
    if (maxV < 0.5) { statusEl.innerText = "ERASED"; statusEl.style.color = "#ff1744"; }
    else { statusEl.innerText = "STABLE"; statusEl.style.color = "#00ff00"; }

    requestAnimationFrame(draw);
}

function addCycle() { cycles += 20; }
function resetSim() { cycles = 0; }

draw();
</script></body></html>
