<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; background: #0a0a0c; color: #eee; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .container { background: #151518; padding: 25px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 850px; }
        h1 { margin-top: 0; font-size: 1.5rem; color: #00e5ff; text-align: center; }
        canvas { background: #000; border-radius: 6px; display: block; margin: 20px auto; border: 1px solid #222; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .control-group { background: #1e1e22; padding: 15px; border-radius: 8px; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #aaa; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #00e5ff; }
        .readout { font-family: monospace; color: #00e5ff; background: #000; padding: 5px 10px; border-radius: 4px; font-size: 1.1rem; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mechanical Flash ADC: Staircase of Snap</h1>
    
    <canvas id="adcCanvas" width="800" height="300"></canvas>

    <div class="controls">
        <div class="control-group">
            <label>Input Force: <span id="forceVal">0</span> mN</label>
            <input type="range" id="forceSlider" min="0" max="120" value="0" step="0.5">
            <div class="readout" id="digitalOut">Code: 00000000 | Value: 0</div>
        </div>
        <div class="control-group">
            <label>Hysteresis Width: <span id="hystVal">20</span> mN</label>
            <input type="range" id="hystSlider" min="0" max="50" value="20">
            <label>Imperfection Gradient (k): <span id="kVal">500</span></label>
            <input type="range" id="kSlider" min="0" max="1000" value="500">
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('adcCanvas');
const ctx = canvas.getContext('2d');
const nBits = 12;
const p_sn0 = 100;

let states = new Array(nBits).fill(0);

function draw() {
    const force = parseFloat(document.getElementById('forceSlider').value);
    const hyst = parseFloat(document.getElementById('hystSlider').value);
    const k = parseFloat(document.getElementById('kSlider').value);

    document.getElementById('forceVal').innerText = force.toFixed(1);
    document.getElementById('hystVal').innerText = hyst;
    document.getElementById('kVal').innerText = k;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const margin = 50;
    const spacing = (canvas.width - 2 * margin) / (nBits - 1);
    
    // Draw threshold gradient background area
    ctx.fillStyle = "rgba(255, 255, 255, 0.03)";
    ctx.fillRect(margin - 20, 20, canvas.width - 2 * margin + 40, canvas.height - 70);

    for (let i = 0; i < nBits; i++) {
        const eps = (i + 1) / (nBits * 20);
        const p_forward = p_sn0 - (k * eps);
        const p_back = p_forward - hyst;

        // Update Logic
        if (states[i] === 0) {
            if (force >= p_forward) states[i] = 1;
        } else {
            if (force <= p_back) states[i] = 0;
        }

        const x = margin + i * spacing;
        const y_forward = canvas.height - 50 - (p_forward * 1.8);
        const y_back = canvas.height - 50 - (p_back * 1.8);

        // Draw Thresholds
        ctx.strokeStyle = "#333";
        ctx.setLineDash([2, 2]);
        ctx.beginPath();
        ctx.moveTo(x, canvas.height - 50);
        ctx.lineTo(x, 20);
        ctx.stroke();
        ctx.setLineDash([]);

        // Forward snap threshold
        ctx.fillStyle = "#ff4444";
        ctx.fillRect(x - 5, y_forward, 10, 2);
        
        // Backward snap threshold
        ctx.fillStyle = "#4444ff";
        ctx.fillRect(x - 5, y_back, 10, 2);

        // Draw Mechanical Beam/Bit
        const beamY = states[i] === 1 ? 40 : canvas.height - 80;
        ctx.fillStyle = states[i] === 1 ? "#00e5ff" : "#333";
        ctx.shadowBlur = states[i] === 1 ? 15 : 0;
        ctx.shadowColor = "#00e5ff";
        ctx.beginPath();
        ctx.roundRect(x - 12, beamY, 24, 30, 4);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Label
        ctx.fillStyle = "#666";
        ctx.font = "10px monospace";
        ctx.textAlign = "center";
        ctx.fillText("B" + i, x, canvas.height - 35);
    }

    // Draw Force Line
    const forceLineY = canvas.height - 50 - (force * 1.8);
    ctx.strokeStyle = "#00e5ff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(margin - 30, forceLineY);
    ctx.lineTo(canvas.width - margin + 30, forceLineY);
    ctx.stroke();

    ctx.fillStyle = "#00e5ff";
    ctx.font = "bold 12px sans-serif";
    ctx.fillText("INPUT FORCE", margin - 40, forceLineY - 5);

    // Update digital display
    let codeStr = states.slice().reverse().join('');
    let val = 0;
    for(let i=0; i<nBits; i++) if(states[i]) val = i+1;
    document.getElementById('digitalOut').innerText = `Code: ${codeStr} | Level: ${val}`;

    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
