<!DOCTYPE html><html><head><style>body{background:#111;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:#000;border:1px solid #444;margin:20px}.controls{display:grid;grid-template-columns:1fr 200px;gap:10px;width:500px}.readout{color:#0f0;font-family:monospace;margin-top:10px}</style></head><body><h2>Silicon Fever Visualization</h2><div class='controls'><label>Dose Rate (Gy/h):</label><input type='range' id='dose' min='0' max='100000' value='10000'><label>Transistor Scale (nm):</label><input type='range' id='scale' min='5' max='50' value='28'></div><div id='metrics' class='readout'></div><canvas id='simCanvas' width='500' height='300'></canvas><script>const canvas=document.getElementById('simCanvas'),ctx=canvas.getContext('2d');const dIn=document.getElementById('dose'),sIn=document.getElementById('scale'),m=document.getElementById('metrics');function draw(){const dose=parseFloat(dIn.value),scale=parseFloat(sIn.value);ctx.clearRect(0,0,500,300);const G=(dose/3600)*2.329/(3.6*1.6e-19)*1e-3;const leak=G*Math.pow(scale*1e-7,3)*1.6e-19*1e9;ctx.strokeStyle='#333';for(let i=0;i<10;i++)for(let j=0;j<6;j++)ctx.strokeRect(i*50,j*50,50,50);const count=Math.min(1000,Math.floor(leak*100));ctx.fillStyle='rgba(255,0,0,0.5)';for(let i=0;i<count;i++)ctx.beginPath(),ctx.arc(Math.random()*500,Math.random()*300,2,0,Math.PI*2),ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(225,125,50,50);ctx.fillStyle='#000';ctx.fillText(scale+'nm',235,155);const health=Math.max(0,100-leak*2);m.innerHTML=`Induced Leakage: ${leak.toFixed(4)} nA | Logic Reliability: ${health.toFixed(1)}%`;requestAnimationFrame(draw)}draw();</script></body></html>
