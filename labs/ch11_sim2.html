<!DOCTYPE html><html><head><style>body{background:#0a0a0a;color:#eee;font-family:monospace;margin:20px;display:flex;flex-direction:column;align-items:center}#container{width:800px;background:#1a1a1a;padding:20px;border-radius:10px;border:1px solid #333}canvas{background:#000;border:1px solid #444;margin-top:10px}.ui{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}.slider-box{background:#222;padding:10px;border-radius:5px}.val{color:#f90;font-weight:bold}.alert{color:#ff4444;font-weight:bold;text-align:center;height:20px}</style></head><body><div id='container'><h2>Ch 11.8: Viscous Self-Heating Simulation</h2><div class='ui'><div class='slider-box'><label>Frequency (f): <span id='fVal' class='val'>1000</span> Hz</label><input type='range' id='freq' min='100' max='100000' step='100' value='1000' style='width:100%'><label>Hysteresis Area (A_hys): <span id='aVal' class='val'>0.05</span></label><input type='range' id='hys' min='0.01' max='0.5' step='0.01' value='0.05' style='width:100%'></div><div class='slider-box'><div>Temperature: <span id='tempDisp' class='val'>293.0</span> K</div><div>Stiffness: <span id='stiffDisp' class='val'>100</span> %</div><div id='msg' class='alert'></div></div></div><canvas id='thermalCanvas' width='760' height='300'></canvas><div style='margin-top:10px;color:#888'>Plot: Red = Temperature (K), Cyan = Elastic Modulus (% Stiffness)</div></div><script>const canvas=document.getElementById('thermalCanvas'),ctx=canvas.getContext('2d');let temp=293,stiff=1,time=0,history=[];const tamb=293,rho=1200,cp=1500,h=10,l=1e-4,alpha=0.005;function step(){let f=parseFloat(document.getElementById('freq').value),ahys=parseFloat(document.getElementById('hys').value);document.getElementById('fVal').innerText=f;document.getElementById('aVal').innerText=ahys;let q_gen=ahys*f;let q_loss=h*(temp-tamb)/l;let dtdt=(q_gen-q_loss)/(rho*cp);temp+=dtdt*0.5;stiff=Math.max(0,1-alpha*(temp-tamb));history.push({t:temp,s:stiff});if(history.length>760)history.shift();document.getElementById('tempDisp').innerText=temp.toFixed(1);document.getElementById('stiffDisp').innerText=(stiff*100).toFixed(1);if(stiff<0.4)document.getElementById('msg').innerText='LOGIC FAILURE: BIT WELLS COLLAPSED';else document.getElementById('msg').innerText='';render();requestAnimationFrame(step)}function render(){ctx.clearRect(0,0,760,300);ctx.lineWidth=2;ctx.beginPath();ctx.strokeStyle='#ff4444';history.forEach((p,i)=>{let py=300-(p.t-290)*2;if(i==0)ctx.moveTo(i,py);else ctx.lineTo(i,py)});ctx.stroke();ctx.beginPath();ctx.strokeStyle='#00ffff';history.forEach((p,i)=>{let py=300-(p.s*250);if(i==0)ctx.moveTo(i,py);else ctx.lineTo(i,py)});ctx.stroke()}step();</script></body></html>
