<!DOCTYPE html><html><head><style>body{background:#f0f0f0;color:#333;font-family:serif;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:#fff;border:1px solid #ccc;box-shadow:0 4px 6px rgba(0,0,0,0.1)} .ui{width:600px;background:#ddd;padding:15px;border-radius:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}input{width:150px}label{font-size:0.9em;font-weight:bold}</style></head><body><h1>Ch3: von Kármán Arch Snap-Through</h1><div class='ui'><div><label>Apex Height (H)</label><br><input type='range' id='hRange' min='10' max='150' value='80'></div><div><label>Applied Load</label><br><input type='range' id='fRange' min='-200' max='200' value='0'></div><button id='reset'>Reset</button></div><canvas id='c' width='600' height='400'></canvas><script>const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let currentW=0,velW=0;const dt=0.2,damping=0.9;function getForce(w,H){const EA=1000,L=200;return(EA/(2*Math.pow(L,3)))*(w*(w-H)*(w-2*H))}function draw(){const H=parseFloat(document.getElementById('hRange').value);const F_ext=parseFloat(document.getElementById('fRange').value);const F_int=getForce(currentW,H);velW=velW*damping+(F_ext-F_int)*dt;currentW+=velW*dt;ctx.clearRect(0,0,600,400);ctx.strokeStyle='#999';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(100,250);ctx.quadraticCurveTo(300,250-H,500,250);ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=4;ctx.strokeStyle='#222';ctx.beginPath();ctx.moveTo(100,250);ctx.quadraticCurveTo(300,250-H+currentW,500,250);ctx.stroke();ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(300,250-H+currentW,8,0,7);ctx.fill();ctx.fillStyle='#000';ctx.fillText('Applied Force Vector',310,240-H+currentW);ctx.beginPath();ctx.moveTo(300,250-H+currentW);ctx.lineTo(300,250-H+currentW+F_ext*0.5);ctx.stroke();ctx.fillStyle='#666';ctx.fillText('Equilibrium Curve (P-w)',10,20);ctx.beginPath();ctx.moveTo(10,150);ctx.lineTo(150,150);ctx.moveTo(10,100);ctx.lineTo(10,200);ctx.stroke();ctx.strokeStyle='#0a0';ctx.beginPath();for(let i=0;i<140;i++){const fw=i*H/70;const fp=getForce(fw,H);ctx.lineTo(10+i,150-fp*0.2)}ctx.stroke();ctx.fillStyle='#00f';ctx.fillRect(10+currentW*(140/(2*H)),150-getForce(currentW,H)*0.2-2,4,4);requestAnimationFrame(draw)}document.getElementById('reset').onclick=()=>{currentW=0;velW=0};draw();</script></body></html>
