<!DOCTYPE html><html><head><style>body{background:#0a0a0c;color:#d0d0d5;font-family:'Segoe UI',Tahoma,sans-serif;text-align:center;padding:20px}canvas{background:#000;border:2px solid #333;border-radius:4px;cursor:crosshair;box-shadow:0 0 20px rgba(0,0,0,0.5)}#ui{margin:20px auto;width:500px;background:#1a1a1e;padding:20px;border-radius:10px;text-align:left}.row{margin-bottom:15px}.val{float:right;color:#4af;font-weight:bold}h2{color:#4af;margin-top:0}p{font-size:13px;color:#888}</style></head><body><h2>Mutual Displacement Engine</h2><canvas id="c"></canvas><div id="ui"><div class="row">Mechanism Type: <span class="val" id="modeLabel">Displacement Inverter</span><br><input type="range" id="mode" min="0" max="1" step="1" value="0" style="width:100%"></div><div class="row">Volume Constraint: <span class="val" id="volLabel">30%</span><br><input type="range" id="vol" min="10" max="60" step="1" value="30" style="width:100%"></div><p>Green Arrows = Input Force | Blue Arrows = Target Displacement (L)</p><button id="run" style="width:100%;padding:10px;background:#4af;border:none;color:#fff;font-weight:bold;border-radius:4px;cursor:pointer">Recalculate Topology</button></div><script>const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),W=500,H=250,nx=50,ny=25;canvas.width=W;canvas.height=H;let x=new Array(nx*ny).fill(0.1);function draw(){ctx.clearRect(0,0,W,H);const dx=W/nx,dy=H/ny;for(let i=0;i<ny;i++){for(let j=0;j<nx;j++){const dens=x[i*nx+j];ctx.fillStyle=`rgba(74, 170, 255, ${dens})`;ctx.fillRect(j*dx,i*dy,dx-1,dy-1)}}ctx.strokeStyle='#0f0';ctx.beginPath();ctx.moveTo(20,H/2);ctx.lineTo(50,H/2);ctx.stroke();ctx.strokeStyle='#4af';ctx.beginPath();ctx.moveTo(W-20,H/2);ctx.lineTo(W-50,H/2);ctx.stroke()}function solve(){const mode=parseInt(document.getElementById('mode').value);const targetVol=parseInt(document.getElementById('vol').value)/100;document.getElementById('modeLabel').textContent=mode===0?'Displacement Inverter':'Force Amplifier';document.getElementById('volLabel').textContent=(targetVol*100).toFixed(0)+'%';for(let iter=0;iter<40;iter++){let sens=new Array(nx*ny);for(let i=0;i<ny;i++){for(let j=0;j<nx;j++){const curX=j/nx,curY=i/ny;let s=0;if(mode===0){const distToLever=Math.abs((curY-0.5)- (0.5-curX)*0.8);s=1.0/(0.1+distToLever)}else{const distToPath=Math.abs(curY-0.5);s=1.0/(0.1+distToPath)}sens[i*nx+j]=s}}let l1=0,l2=1e5;for(let b=0;b<20;b++){let mid=(l1+l2)/2;let v=0;for(let k=0;k<nx*ny;k++)v+=Math.max(0,Math.min(1,x[k]*Math.pow(sens[k]/mid,0.5)));if(v/(nx*ny)>targetVol)l1=mid;else l2=mid}for(let k=0;k<nx*ny;k++)x[k]=Math.max(0,Math.min(1,x[k]*Math.pow(sens[k]/l2,0.5)))}draw()}document.getElementById('run').onclick=solve;document.getElementById('mode').oninput=solve;solve();</script></body></html>
