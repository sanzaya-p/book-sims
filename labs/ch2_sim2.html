<!DOCTYPE html><html><head><style>body{background:#0a0a0a;color:#0f0;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center}canvas{background:#000;border:1px solid #0f0;box-shadow:0 0 10px #0f0}#ui{width:600px;margin-top:15px;border:1px solid #0f0;padding:15px}.bar-container{width:100%;background:#222;height:20px;margin:10px 0}.bar{height:100%;background:#0f0;width:0%}button{background:transparent;border:1px solid #0f0;color:#0f0;padding:8px 15px;cursor:pointer}button:active{background:#0f0;color:#000}</style></head><body><h2>Embodied Logic: Snap-Through Memory</h2><canvas id="energyCanvas" width="600" height="300"></canvas><div id="ui"><button onclick="triggerPulse()">Trigger Hair (Pulse)</button><button onclick="resetSim()" style="margin-left:10px">Reset</button><div>Calcium Level:</div><div class="bar-container"><div id="caBar" class="bar"></div></div><div id="status">State: COCKED (CONVEX)</div></div><script>const canvas=document.getElementById('energyCanvas'),ctx=canvas.getContext('2d');let ca=0,phi=-1,t=0;const tau_ca=200,dt=1;function triggerPulse(){ca+=1.2}function resetSim(){ca=0;phi=-1;t=0}function getEnergy(x,c){const a=10*(1-0.6*c),b=20,c6=10.5;return a*x*x - b*Math.pow(x,4) + c6*Math.pow(x,6)}function draw(){ctx.clearRect(0,0,600,300);ctx.strokeStyle='#0f0';ctx.beginPath();for(let x=-1.5;x<=1.5;x+=0.05){const px=300+x*150;const py=250-getEnergy(x,ca)*4;if(x===-1.5)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(300+phi*150,250-getEnergy(phi,ca)*4-5,8,0,Math.PI*2);ctx.fill();ca*=(1-1/tau_ca);const a_eff=10*(1-0.6*ca),b=20,c6=10.5;const force=-(2*a_eff*phi-4*b*Math.pow(phi,3)+6*c6*Math.pow(phi,5));phi+=force*0.01;document.getElementById('caBar').style.width=Math.min(100,ca*40)+'%';document.getElementById('status').innerText=phi>0?'State: SNAPPED (CONCAVE)':'State: COCKED (CONVEX)';requestAnimationFrame(draw)}draw();</script></body></html>
